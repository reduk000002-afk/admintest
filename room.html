<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Binance Brief · Брифінг</title>
<script src="https://cdn.whereby.com/embed.js"></script>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0a0a; }
  #meeting { width:100%; height:100%; }
</style>
</head>
<body>
<div id="meeting"></div>

<script>
  // Имя сотрудника из URL
  const params = new URLSearchParams(window.location.search);
  const userName = params.get('user') || 'Guest';

  // Ссылка участников
  const roomUrl = "https://spam.whereby.com/spam-%D0%B5%D1%83%D1%84%D1%8C30421668-7aae-4d75-a986-16f5af820fbe";

  Whereby.embed("meeting", {
    room: roomUrl,
    displayName: userName,
    theme: "dark",
    hideChat: true,     // Скрыть чат
    hidePeople: true,   // Скрыть участников
    skipPrejoin: true   // Пропустить экран "Подключение"
  });
</script>
</body>
</html>
