<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Админ панель | Обучение</title>
    <link rel="icon" type="image/png" href="aurum.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000000;
            color: #ffffff;
            padding: 16px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #888;
            margin-bottom: 24px;
            font-size: 14px;
        }

        /* Кнопка добавления */
        .add-btn {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .add-btn:hover {
            background: #e0e0e0;
        }

        /* Таблицы */
        .section {
            background: #0a0a0a;
            border: 1px solid #2a2a2a;
            border-radius: 16px;
            margin-bottom: 24px;
            overflow-x: auto;
        }

        .section-header {
            padding: 16px 20px;
            background: #0f0f0f;
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .section-header h2 {
            font-size: 18px;
        }

        .section-header select {
            background: #141414;
            border: 1px solid #2a2a2a;
            color: #ffffff;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px;
        }

        th, td {
            padding: 12px 12px;
            text-align: left;
            border-bottom: 1px solid #1a1a1a;
            font-size: 13px;
        }

        th {
            background: #0a0a0a;
            color: #888;
            font-weight: 500;
        }

        .user-row {
            cursor: pointer;
            transition: background 0.2s;
        }

        .user-row:hover {
            background: #141414;
        }

        .user-row.selected {
            background: #1a1a1a;
            border-left: 3px solid #ffffff;
        }

        /* Бейджи */
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 500;
            white-space: nowrap;
        }

        .badge-passed {
            background: #4ade8020;
            color: #4ade80;
            border: 1px solid #4ade8040;
        }

        .badge-pending {
            background: #88888820;
            color: #888;
            border: 1px solid #88888840;
        }

        /* Модальное окно добавления */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: #0a0a0a;
            border: 1px solid #2a2a2a;
            border-radius: 24px;
            max-width: 500px;
            width: 90%;
            padding: 24px;
        }

        .modal-content h3 {
            font-size: 22px;
            margin-bottom: 20px;
        }

        .modal-content input {
            width: 100%;
            padding: 12px 16px;
            background: #141414;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            color: #ffffff;
            font-size: 15px;
            margin-bottom: 16px;
        }

        .modal-content input:focus {
            outline: none;
            border-color: #ffffff;
        }

        .modal-content input::placeholder {
            color: #3a3a3a;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .modal-btn {
            flex: 1;
            padding: 12px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            text-align: center;
        }

        .modal-btn-primary {
            background: #ffffff;
            color: #000000;
        }

        .modal-btn-secondary {
            background: transparent;
            border: 1px solid #2a2a2a;
            color: #ffffff;
        }

        /* Детали сотрудника */
        .test-details {
            padding: 16px 20px;
        }

        .result-card {
            background: #141414;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid #2a2a2a;
            flex-wrap: wrap;
            gap: 8px;
        }

        .result-date {
            color: #888;
            font-size: 11px;
        }

        .result-score {
            font-size: 16px;
            font-weight: 600;
        }

        .result-score.passed {
            color: #4ade80;
        }

        .result-score.failed {
            color: #ff4444;
        }

        .answers-list {
            margin-top: 12px;
        }

        .answer-item {
            padding: 10px;
            background: #0a0a0a;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .answer-question {
            font-weight: 500;
            margin-bottom: 6px;
            font-size: 13px;
        }

        .answer-details {
            display: flex;
            gap: 12px;
            font-size: 12px;
            flex-wrap: wrap;
        }

        .user-answer.correct {
            color: #4ade80;
        }

        .user-answer.incorrect {
            color: #ff4444;
        }

        .correct-answer {
            color: #4ade80;
        }

        .notes-card {
            background: #141414;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .notes-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #2a2a2a;
        }

        .notes-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .note-item {
            padding: 8px 10px;
            background: #0a0a0a;
            border-radius: 8px;
            font-size: 12px;
        }

        .note-number {
            color: #888;
            margin-right: 8px;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #888;
            font-size: 14px;
        }

        .back-link {
            display: inline-block;
            margin-top: 16px;
            color: #888;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            color: #fff;
        }

        /* Адаптация под телефон */
        @media (max-width: 768px) {
            body {
                padding: 12px;
            }
            
            h1 {
                font-size: 20px;
            }
            
            .section-header {
                padding: 12px 16px;
            }
            
            .section-header h2 {
                font-size: 16px;
            }
            
            th, td {
                padding: 8px 8px;
                font-size: 11px;
            }
            
            .badge {
                font-size: 9px;
                padding: 3px 6px;
            }
            
            .test-details {
                padding: 12px;
            }
            
            .result-card {
                padding: 12px;
            }
            
            .modal-content {
                padding: 20px;
            }
            
            .modal-content h3 {
                font-size: 18px;
            }
        }

        @media (max-width: 480px) {
            table {
                min-width: 500px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📊 Админ панель</h1>
    <p class="subtitle">Управление сотрудниками и просмотр результатов</p>

    <div class="section">
        <div class="section-header">
            <h2>👥 Сотрудники</h2>
            <div style="display: flex; gap: 12px;">
                <select id="levelFilter">
                    <option value="all">Все уровни</option>
                    <option value="1">Уровень 1</option>
                    <option value="2">Уровень 2</option>
                    <option value="3">Уровень 3</option>
                </select>
                <button class="add-btn" id="addUserBtn">➕ Добавить</button>
            </div>
        </div>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Логин</th>
                        <th>Имя</th>
                        <th>Telegram</th>
                        <th>Уровень</th>
                        <th>Тест 1</th>
                        <th>Тест 2</th>
                        <th>Тест 3</th>
                        <th>Заметки</th>
                    </tr>
                </thead>
                <tbody id="usersList"></tbody>
            </table>
        </div>
    </div>

    <div class="section" id="resultsSection" style="display: none;">
        <div class="section-header">
            <h2 id="selectedUserName">📝 Детали сотрудника</h2>
        </div>
        <div id="resultsContent" class="test-details">
            <div class="empty-state">Выберите сотрудника для просмотра результатов</div>
        </div>
    </div>

    <a href="index.html" class="back-link">← Вернуться на главную</a>
</div>

<!-- Модальное окно добавления пользователя -->
<div id="addUserModal" class="modal">
    <div class="modal-content">
        <h3>➕ Добавить сотрудника</h3>
        <input type="text" id="newLogin" placeholder="Логин *" autocomplete="off">
        <input type="text" id="newPassword" placeholder="Пароль *" autocomplete="off">
        <input type="text" id="newName" placeholder="Имя *" autocomplete="off">
        <input type="text" id="newTelegram" placeholder="Telegram ник (необязательно)" autocomplete="off">
        <div class="modal-buttons">
            <button class="modal-btn modal-btn-secondary" id="cancelAddBtn">Отмена</button>
            <button class="modal-btn modal-btn-primary" id="confirmAddBtn">Добавить</button>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://hmlcwfrbymdnofhunibd.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_25VHjp6VP8_OcNsPuBBpqg_0hua7oPG';
    
    let users = [];
    let selectedUserId = null;

    async function fetchUsers() {
        try {
            const response = await fetch(`${SUPABASE_URL}/rest/v1/users?select=*&order=id.asc`, {
                method: 'GET',
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': `Bearer ${SUPABASE_KEY}`,
                    'Content-Type': 'application/json'
                }
            });
            
            if (response.ok) {
                users = await response.json();
                renderUsersTable();
            }
        } catch (error) {
            console.error('Ошибка загрузки пользователей:', error);
        }
    }

    async function addUser(login, password, name, telegramNick) {
        try {
            const newUser = {
                login: login,
                password: password,
                full_name: name,
                telegram_nick: telegramNick || null,
                current_level: 1,
                level1_test_passed: false,
                level2_test_passed: false,
                level3_test_passed: false,
                role: 'user'
            };
            
            const response = await fetch(`${SUPABASE_URL}/rest/v1/users`, {
                method: 'POST',
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': `Bearer ${SUPABASE_KEY}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(newUser)
            });
            
            if (response.ok) {
                alert('✅ Сотрудник успешно добавлен!');
                fetchUsers();
                return true;
            } else {
                const error = await response.json();
                alert('❌ Ошибка: ' + (error.message || 'Логин уже существует'));
                return false;
            }
        } catch (error) {
            alert('❌ Ошибка подключения: ' + error.message);
            return false;
        }
    }

    function getTestStatus(user, level) {
        if (level === 1) return user.level1_test_passed ? 'passed' : 'pending';
        if (level === 2) return user.level2_test_passed ? 'passed' : 'pending';
        if (level === 3) return user.level3_test_passed ? 'passed' : 'pending';
        return 'pending';
    }

    function renderUsersTable() {
        const filter = document.getElementById('levelFilter').value;
        let filteredUsers = users;
        
        if (filter !== 'all') {
            filteredUsers = users.filter(u => u.current_level === parseInt(filter));
        }
        
        const tbody = document.getElementById('usersList');
        tbody.innerHTML = filteredUsers.map(user => `
            <tr class="user-row ${selectedUserId === user.id ? 'selected' : ''}" data-user-id="${user.id}">
                <td>${user.id}</td>
                <td>${escapeHtml(user.login)}</td>
                <td>${escapeHtml(user.full_name)}</td>
                <td>${user.telegram_nick ? '@' + escapeHtml(user.telegram_nick) : '-'}</td>
                <td><span class="badge">${user.current_level}</span></td>
                <td><span class="badge ${getTestStatus(user, 1) === 'passed' ? 'badge-passed' : 'badge-pending'}">${getTestStatus(user, 1) === 'passed' ? '✅' : '⏳'}</span></td>
                <td><span class="badge ${getTestStatus(user, 2) === 'passed' ? 'badge-passed' : 'badge-pending'}">${getTestStatus(user, 2) === 'passed' ? '✅' : '⏳'}</span></td>
                <td><span class="badge ${getTestStatus(user, 3) === 'passed' ? 'badge-passed' : 'badge-pending'}">${getTestStatus(user, 3) === 'passed' ? '✅' : '⏳'}</span></td>
                <td>${user.level3_notes ? '📝' : '—'}</td>
            </tr>
        `).join('');
        
        document.querySelectorAll('.user-row').forEach(row => {
            row.addEventListener('click', () => {
                const userId = parseInt(row.dataset.userId);
                selectUser(userId);
            });
        });
    }

    async function selectUser(userId) {
        selectedUserId = userId;
        renderUsersTable();
        
        const selectedUser = users.find(u => u.id === userId);
        document.getElementById('selectedUserName').innerHTML = `📝 ${escapeHtml(selectedUser?.full_name)} (@${escapeHtml(selectedUser?.telegram_nick || 'нет' )})`;
        document.getElementById('resultsSection').style.display = 'block';
        
        await Promise.all([
            fetchTestResults(userId),
            fetchUserNotes(selectedUser)
        ]);
    }

    async function fetchTestResults(userId) {
        try {
            const response = await fetch(`${SUPABASE_URL}/rest/v1/test_results?user_id=eq.${userId}&select=*&order=completed_at.desc`, {
                method: 'GET',
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': `Bearer ${SUPABASE_KEY}`,
                    'Content-Type': 'application/json'
                }
            });
            
            if (response.ok) {
                const results = await response.json();
                renderTestResults(results);
            }
        } catch (error) {
            console.error('Ошибка загрузки результатов:', error);
        }
    }

    function renderTestResults(results) {
        const resultsContent = document.getElementById('resultsContent');
        const existingNotes = resultsContent.querySelector('.notes-card');
        
        if (!results || results.length === 0) {
            if (!existingNotes) {
                resultsContent.innerHTML = '<div class="empty-state">📭 У сотрудника пока нет пройденных тестов</div>';
            }
            return;
        }
        
        const testsHtml = results.map(result => {
            const passed = result.score === result.total_questions;
            const answers = result.answers || [];
            
            return `
                <div class="result-card">
                    <div class="result-header">
                        <div>
                            <strong>${result.level === 1 ? '📘 Уровень 1' : (result.level === 2 ? '📙 Уровень 2' : '📕 Финальный тест')}</strong>
                            <div class="result-date">${new Date(result.completed_at).toLocaleString()}</div>
                        </div>
                        <div class="result-score ${passed ? 'passed' : 'failed'}">
                            ${result.score}/${result.total_questions}
                            ${passed ? '✅' : '❌'}
                        </div>
                    </div>
                    <div class="answers-list">
                        ${answers.map((answer, idx) => `
                            <div class="answer-item">
                                <div class="answer-question">${idx + 1}. ${escapeHtml(answer.question)}</div>
                                <div class="answer-details">
                                    <span>Ответ: </span>
                                    <span class="user-answer ${answer.is_correct ? 'correct' : 'incorrect'}">
                                        "${escapeHtml(answer.user_answer)}"
                                    </span>
                                    ${!answer.is_correct ? `
                                        <span>✓ Правильно: <span class="correct-answer">"${escapeHtml(answer.correct_answer)}"</span></span>
                                    ` : ''}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }).join('');
        
        const notesCard = existingNotes ? existingNotes.outerHTML : '';
        resultsContent.innerHTML = testsHtml + (notesCard || '');
    }

    function fetchUserNotes(user) {
        const resultsContent = document.getElementById('resultsContent');
        
        if (user.level3_notes) {
            const notesArray = user.level3_notes.split('|');
            const notesHtml = `
                <div class="notes-card">
                    <div class="notes-title">📝 Заметки по диалогам (уровень 3)</div>
                    <div class="notes-list">
                        ${notesArray.map((note, i) => `
                            <div class="note-item">
                                <span class="note-number">${i + 1}.</span>
                                <span>${escapeHtml(note) || '—'}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            
            const currentHtml = resultsContent.innerHTML;
            if (currentHtml.includes('empty-state')) {
                resultsContent.innerHTML = notesHtml;
            } else if (!currentHtml.includes('notes-card')) {
                resultsContent.innerHTML = currentHtml + notesHtml;
            }
        }
    }

    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // Модальное окно добавления
    const modal = document.getElementById('addUserModal');
    
    document.getElementById('addUserBtn').addEventListener('click', () => {
        document.getElementById('newLogin').value = '';
        document.getElementById('newPassword').value = '';
        document.getElementById('newName').value = '';
        document.getElementById('newTelegram').value = '';
        modal.style.display = 'flex';
    });
    
    document.getElementById('cancelAddBtn').addEventListener('click', () => {
        modal.style.display = 'none';
    });
    
    document.getElementById('confirmAddBtn').addEventListener('click', async () => {
        const login = document.getElementById('newLogin').value.trim();
        const password = document.getElementById('newPassword').value.trim();
        const name = document.getElementById('newName').value.trim();
        const telegram = document.getElementById('newTelegram').value.trim();
        
        if (!login || !password || !name) {
            alert('❌ Заполните обязательные поля: Логин, Пароль, Имя');
            return;
        }
        
        await addUser(login, password, name, telegram || null);
        modal.style.display = 'none';
    });
    
    // Закрытие по клику вне модалки
    window.onclick = (event) => {
        if (event.target === modal) {
            modal.style.display = 'none';
        }
    };
    
    document.getElementById('levelFilter').addEventListener('change', () => {
        renderUsersTable();
    });
    
    fetchUsers();
</script>
</body>
</html>
