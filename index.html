<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Briefing</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: #f0b90b;
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
        }

        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-box {
            background: #1a1a1a;
            border: 2px solid #f0b90b;
            border-radius: 32px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(240, 185, 11, 0.1);
        }

        .auth-title {
            font-size: 24px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        .auth-input {
            width: 100%;
            padding: 15px 20px;
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 16px;
            color: #f0b90b;
            font-size: 16px;
            margin-bottom: 15px;
            transition: all 0.3s;
        }

        .auth-input:focus {
            outline: none;
            border-color: #f0b90b;
            box-shadow: 0 0 0 2px rgba(240, 185, 11, 0.2);
        }

        .auth-btn {
            width: 100%;
            padding: 15px;
            background: #f0b90b;
            border: none;
            border-radius: 16px;
            color: #0a0a0a;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .auth-btn:hover {
            background: #ffd700;
            transform: translateY(-2px);
        }

        .main-container {
            display: none;
            height: 100vh;
            grid-template-columns: 280px 1fr 320px;
            background: #0a0a0a;
        }

        .users-panel {
            background: #111;
            border-right: 1px solid #333;
            padding: 20px 0;
            overflow-y: auto;
        }

        .panel-header {
            padding: 0 20px 20px;
            border-bottom: 1px solid #333;
        }

        .panel-title {
            font-size: 18px;
            font-weight: 600;
            color: #f0b90b;
            margin-bottom: 15px;
        }

        .search-container {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .search-input {
            flex: 1;
            padding: 10px 15px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            color: #f0b90b;
            font-size: 14px;
        }

        .search-btn {
            padding: 10px 20px;
            background: #f0b90b;
            border: none;
            border-radius: 12px;
            color: #0a0a0a;
            font-weight: 600;
            cursor: pointer;
        }

        .user-list {
            padding: 10px 0;
        }

        .user-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            cursor: pointer;
            transition: all 0.2s;
            border-left: 3px solid transparent;
        }

        .user-item:hover {
            background: #1a1a1a;
        }

        .user-item.active {
            background: #1a1a1a;
            border-left-color: #f0b90b;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            background: #222;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f0b90b;
            font-weight: 600;
            border: 2px solid #f0b90b;
        }

        .user-info {
            flex: 1;
        }

        .user-name {
            color: #fff;
            font-size: 14px;
            font-weight: 500;
        }

        .user-id {
            color: #888;
            font-size: 12px;
        }

        .chat-panel {
            display: flex;
            flex-direction: column;
            background: #0a0a0a;
        }

        .chat-header {
            padding: 20px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-title {
            font-size: 18px;
            font-weight: 600;
        }

        .conference-btn {
            background: #f0b90b;
            color: #0a0a0a;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .conference-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: #333;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 70%;
            display: flex;
            flex-direction: column;
        }

        .message.own {
            align-self: flex-end;
        }

        .message-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
            font-size: 12px;
        }

        .message-sender {
            color: #f0b90b;
            font-weight: 500;
        }

        .message-time {
            color: #666;
        }

        .message-content {
            padding: 12px 16px;
            background: #1a1a1a;
            border-radius: 16px 16px 16px 4px;
            color: #fff;
            word-break: break-word;
        }

        .message.own .message-content {
            background: #f0b90b;
            color: #0a0a0a;
            border-radius: 16px 16px 4px 16px;
        }

        .chat-input-area {
            padding: 20px;
            border-top: 1px solid #333;
            display: flex;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            padding: 15px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            color: #f0b90b;
            font-size: 14px;
        }

        .send-btn {
            padding: 15px 25px;
            background: #f0b90b;
            border: none;
            border-radius: 12px;
            color: #0a0a0a;
            font-weight: 600;
            cursor: pointer;
        }

        .profile-panel {
            background: #111;
            border-left: 1px solid #333;
            padding: 20px;
            overflow-y: auto;
        }

        .profile-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .profile-avatar {
            width: 80px;
            height: 80px;
            background: #222;
            border-radius: 50%;
            border: 3px solid #f0b90b;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 600;
            color: #f0b90b;
        }

        .profile-name {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .profile-id {
            color: #888;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .profile-info {
            background: #1a1a1a;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #333;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: #888;
        }

        .info-value {
            color: #f0b90b;
            font-weight: 500;
        }

        .profile-btn {
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 1px solid #f0b90b;
            border-radius: 12px;
            color: #f0b90b;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 10px;
        }

        .profile-btn:hover {
            background: #f0b90b;
            color: #0a0a0a;
        }

        .profile-btn.danger {
            border-color: #ff4444;
            color: #ff4444;
        }

        .admin-panel {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            padding: 40px;
            overflow-y: auto;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.9);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: #1a1a1a;
            border: 2px solid #f0b90b;
            border-radius: 32px;
            padding: 40px;
            width: 90%;
            max-width: 500px;
        }

        .modal-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: center;
        }

        .modal-input {
            width: 100%;
            padding: 15px;
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 12px;
            color: #f0b90b;
            margin-bottom: 15px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
        }

        .modal-btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .modal-btn.save {
            background: #f0b90b;
            color: #0a0a0a;
        }

        .modal-btn.cancel {
            background: #333;
            color: white;
        }

        .video-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #1a1a1a;
            border: 3px solid #f0b90b;
            border-radius: 24px;
            padding: 20px;
            z-index: 1500;
            max-width: 90vw;
        }

        .video-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .video-wrapper {
            position: relative;
            width: 400px;
            height: 300px;
        }

        .video-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 12px;
            border: 2px solid #f0b90b;
        }

        .video-label {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: #f0b90b;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="auth-container" id="authContainer">
        <div class="auth-box">
            <div class="auth-title">Вход в систему</div>
            <input type="text" class="auth-input" id="loginInput" placeholder="Логин">
            <input type="password" class="auth-input" id="passwordInput" placeholder="Пароль">
            <button class="auth-btn" id="loginBtn">Войти</button>
            <div style="color: #ff4444; margin-top: 15px; text-align: center; font-size: 14px;" id="authError"></div>
        </div>
    </div>

    <div class="main-container" id="mainContainer">
        <div class="users-panel">
            <div class="panel-header">
                <div class="panel-title">Контакты</div>
                <div class="search-container">
                    <input type="text" class="search-input" id="userSearch" placeholder="Введите ID (7 цифр)">
                    <button class="search-btn" id="searchBtn">Найти</button>
                </div>
            </div>
            <div class="user-list" id="userList"></div>
        </div>

        <div class="chat-panel">
            <div class="chat-header">
                <div class="chat-title" id="currentChatTitle">Общий чат</div>
                <button class="conference-btn" id="conferenceBtn">Начать конференцию</button>
            </div>
            <div class="messages-container" id="messagesContainer"></div>
            <div class="chat-input-area">
                <input type="text" class="chat-input" id="messageInput" placeholder="Сообщение...">
                <button class="send-btn" id="sendBtn">→</button>
            </div>
        </div>

        <div class="profile-panel" id="profilePanel">
            <div class="profile-header">
                <div class="profile-avatar" id="profileAvatar">?</div>
                <div class="profile-name" id="profileName">---</div>
                <div class="profile-id" id="profileId">ID: ---</div>
            </div>
            <div class="profile-info">
                <div class="info-row">
                    <span class="info-label">Логин</span>
                    <span class="info-value" id="profileLogin">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Статус</span>
                    <span class="info-value" id="profileStatus">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Мой ID</span>
                    <span class="info-value" id="profileMyId">-</span>
                </div>
            </div>
            <button class="profile-btn" id="editProfileBtn">Редактировать профиль</button>
            <button class="profile-btn" id="changePasswordBtn">Изменить пароль</button>
            <button class="profile-btn danger" id="logoutBtn">Выйти</button>
            <button class="profile-btn" id="adminPanelBtn" style="display: none; margin-top: 20px; border-color: #ff4444; color: #ff4444;">👑 Админ-панель</button>
        </div>
    </div>

    <div class="admin-panel" id="adminPanel">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <div style="font-size: 28px; font-weight: 600;">👑 Панель администратора</div>
            <div style="font-size: 32px; cursor: pointer; color: #f0b90b;" id="closeAdminBtn">×</div>
        </div>
        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px;" id="adminUsersGrid"></div>
    </div>

    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-title" id="modalTitle">Редактирование</div>
            <input type="text" class="modal-input" id="modalInput1" placeholder="">
            <input type="text" class="modal-input" id="modalInput2" placeholder="">
            <input type="password" class="modal-input" id="modalInput3" placeholder="Новый пароль">
            <div class="modal-buttons">
                <button class="modal-btn save" id="modalSaveBtn">Сохранить</button>
                <button class="modal-btn cancel" id="modalCancelBtn">Отмена</button>
            </div>
        </div>
    </div>

    <div class="modal" id="videoModal">
        <div class="video-container">
            <div class="video-grid" id="videoGrid"></div>
            <div style="display: flex; gap: 10px; justify-content: center; margin-top: 20px;">
                <button class="profile-btn" id="videoMicBtn">🎤 Выкл</button>
                <button class="profile-btn danger" id="videoLeaveBtn">🚪 Выйти</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="livekit.js"></script>

    <script>
        const SUPABASE_URL = 'https://mqqlcfcwufdqwslukziy.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_pj766xnnI6WD4kiw7_kSSg_oaIiSYIr';
        const LIVEKIT_URL = 'wss://testzvonok-3q10z44j.livekit.cloud';

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let currentChat = 'group';
        let messagesSubscription = null;
        let usersSubscription = null;
        let contactsSubscription = null;
        let room = null;
        const LiveKit = window.LivekitClient || window.LiveKit;

        // DOM элементы
        const authContainer = document.getElementById('authContainer');
        const mainContainer = document.getElementById('mainContainer');
        const loginBtn = document.getElementById('loginBtn');
        const loginInput = document.getElementById('loginInput');
        const passwordInput = document.getElementById('passwordInput');
        const authError = document.getElementById('authError');
        const userList = document.getElementById('userList');
        const userSearch = document.getElementById('userSearch');
        const searchBtn = document.getElementById('searchBtn');
        const messagesContainer = document.getElementById('messagesContainer');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const currentChatTitle = document.getElementById('currentChatTitle');
        const conferenceBtn = document.getElementById('conferenceBtn');
        const profileName = document.getElementById('profileName');
        const profileId = document.getElementById('profileId');
        const profileLogin = document.getElementById('profileLogin');
        const profileStatus = document.getElementById('profileStatus');
        const profileMyId = document.getElementById('profileMyId');
        const profileAvatar = document.getElementById('profileAvatar');
        const editProfileBtn = document.getElementById('editProfileBtn');
        const changePasswordBtn = document.getElementById('changePasswordBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const adminPanelBtn = document.getElementById('adminPanelBtn');
        const adminPanel = document.getElementById('adminPanel');
        const closeAdminBtn = document.getElementById('closeAdminBtn');
        const adminUsersGrid = document.getElementById('adminUsersGrid');
        const editModal = document.getElementById('editModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalInput1 = document.getElementById('modalInput1');
        const modalInput2 = document.getElementById('modalInput2');
        const modalInput3 = document.getElementById('modalInput3');
        const modalSaveBtn = document.getElementById('modalSaveBtn');
        const modalCancelBtn = document.getElementById('modalCancelBtn');
        const videoModal = document.getElementById('videoModal');
        const videoGrid = document.getElementById('videoGrid');
        const videoMicBtn = document.getElementById('videoMicBtn');
        const videoLeaveBtn = document.getElementById('videoLeaveBtn');

        // ===============================================
        // АВТОРИЗАЦИЯ
        // ===============================================

        loginBtn.addEventListener('click', async () => {
            const username = loginInput.value.trim();
            const password = passwordInput.value.trim();

            if (!username || !password) {
                authError.textContent = 'Введите логин и пароль';
                return;
            }

            try {
                const { data: users, error } = await supabaseClient
                    .from('users')
                    .select('*')
                    .eq('username', username)
                    .eq('password', password);

                if (error) throw error;

                if (users && users.length > 0) {
                    const user = users[0];
                    
                    if (user.status === 'blocked') {
                        authError.textContent = 'Пользователь заблокирован';
                        return;
                    }

                    currentUser = user;
                    authContainer.style.display = 'none';
                    mainContainer.style.display = 'grid';
                    
                    if (user.username === 'German') {
                        adminPanelBtn.style.display = 'block';
                    }
                    
                    updateProfilePanel();
                    loadContacts();
                    subscribeToContacts();
                    subscribeToMessages();
                } else {
                    authError.textContent = 'Неверный логин или пароль';
                }
            } catch (error) {
                console.error('Ошибка авторизации:', error);
                authError.textContent = 'Ошибка подключения к базе';
            }
        });

        // ===============================================
        // ПОИСК ПОЛЬЗОВАТЕЛЕЙ ПО ID
        // ===============================================

        searchBtn.addEventListener('click', searchUserById);
        userSearch.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchUserById();
        });

        async function searchUserById() {
            const searchId = userSearch.value.trim();
            if (!searchId || searchId.length !== 7 || isNaN(searchId)) {
                alert('Введите 7-значный ID');
                return;
            }

            try {
                const { data: users, error } = await supabaseClient
                    .from('users')
                    .select('*')
                    .eq('user_id_string', searchId)
                    .neq('id', currentUser.id);

                if (error) throw error;

                if (users && users.length > 0) {
                    const foundUser = users[0];
                    
                    // Добавляем в контакты
                    await supabaseClient
                        .from('user_contacts')
                        .insert([{
                            user_id: currentUser.id,
                            contact_id: foundUser.id
                        }])
                        .maybeSingle();

                    loadContacts();
                    userSearch.value = '';
                } else {
                    alert('Пользователь с таким ID не найден');
                }
            } catch (error) {
                console.error('Ошибка поиска:', error);
            }
        }

        // ===============================================
        // ЗАГРУЗКА КОНТАКТОВ
        // ===============================================

        async function loadContacts() {
            try {
                const { data: contacts, error } = await supabaseClient
                    .from('user_contacts')
                    .select('contact_id, users!user_contacts_contact_id_fkey(*)')
                    .eq('user_id', currentUser.id);

                if (error) throw error;

                const contactUsers = contacts.map(c => c.users);
                renderUserList(contactUsers);
            } catch (error) {
                console.error('Ошибка загрузки контактов:', error);
            }
        }

        function renderUserList(users) {
            userList.innerHTML = users.map(user => `
                <div class="user-item ${currentChat === user.id ? 'active' : ''}" onclick="selectChat('${user.id}', '${user.display_name !== '---' ? user.display_name : user.username}')">
                    <div class="user-avatar">${user.display_name && user.display_name !== '---' ? user.display_name[0] : user.username[0].toUpperCase()}</div>
                    <div class="user-info">
                        <div class="user-name">${user.display_name !== '---' ? user.display_name : user.username}</div>
                        <div class="user-id">ID: ${user.user_id_string}</div>
                    </div>
                </div>
            `).join('');
        }

        window.selectChat = function(userId, userName) {
            currentChat = userId;
            currentChatTitle.textContent = `Чат с ${userName}`;
            loadPrivateMessages(userId);
        };

        // ===============================================
        // ЗАГРУЗКА СООБЩЕНИЙ
        // ===============================================

        async function loadPrivateMessages(otherUserId) {
            try {
                const { data: messages, error } = await supabaseClient
                    .from('private_messages')
                    .select('*, sender:sender_id(*)')
                    .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${otherUserId}),and(sender_id.eq.${otherUserId},receiver_id.eq.${currentUser.id})`)
                    .order('created_at', { ascending: true });

                if (error) throw error;

                renderMessages(messages);
            } catch (error) {
                console.error('Ошибка загрузки сообщений:', error);
            }
        }

        function renderMessages(messages) {
            messagesContainer.innerHTML = messages.map(msg => {
                const isOwn = msg.sender_id === currentUser.id;
                const sender = msg.sender || {};
                const time = new Date(msg.created_at).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
                
                return `
                    <div class="message ${isOwn ? 'own' : ''}">
                        <div class="message-header">
                            <span class="message-sender">${isOwn ? 'Вы' : (sender.display_name !== '---' ? sender.display_name : sender.username)}</span>
                            <span class="message-time">${time}</span>
                        </div>
                        <div class="message-content">${msg.message}</div>
                    </div>
                `;
            }).join('');
            
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // ===============================================
        // ОТПРАВКА СООБЩЕНИЙ
        // ===============================================

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text || currentChat === 'group') return;

            try {
                const { error } = await supabaseClient
                    .from('private_messages')
                    .insert([{
                        sender_id: currentUser.id,
                        receiver_id: currentChat,
                        message: text,
                        created_at: new Date()
                    }]);

                if (error) throw error;

                messageInput.value = '';
            } catch (error) {
                console.error('Ошибка отправки:', error);
            }
        }

        // ===============================================
        // ПОДПИСКИ (РИАЛТАЙМ)
        // ===============================================

        function subscribeToMessages() {
            if (messagesSubscription) {
                supabaseClient.removeChannel(messagesSubscription);
            }

            messagesSubscription = supabaseClient
                .channel('messages')
                .on('postgres_changes',
                    { event: 'INSERT', schema: 'public', table: 'private_messages' },
                    (payload) => {
                        if (currentChat !== 'group' && 
                            (payload.new.sender_id === currentChat || payload.new.receiver_id === currentChat)) {
                            loadPrivateMessages(currentChat);
                        }
                    }
                )
                .subscribe();
        }

        function subscribeToContacts() {
            if (contactsSubscription) {
                supabaseClient.removeChannel(contactsSubscription);
            }

            contactsSubscription = supabaseClient
                .channel('contacts')
                .on('postgres_changes',
                    { event: 'INSERT', schema: 'public', table: 'user_contacts', filter: `user_id=eq.${currentUser?.id}` },
                    () => {
                        loadContacts();
                    }
                )
                .subscribe();
        }

        // ===============================================
        // ПРОФИЛЬ
        // ===============================================

        function updateProfilePanel() {
            if (!currentUser) return;

            profileName.textContent = currentUser.display_name !== '---' ? currentUser.display_name : currentUser.username;
            profileId.textContent = `ID: ${currentUser.user_id_string}`;
            profileLogin.textContent = currentUser.username;
            profileStatus.textContent = currentUser.status === 'active' ? 'Активен' : 'Заблокирован';
            profileMyId.textContent = currentUser.user_id_string;
            profileAvatar.textContent = currentUser.display_name !== '---' ? currentUser.display_name[0] : currentUser.username[0].toUpperCase();
        }

        editProfileBtn.addEventListener('click', () => {
            modalTitle.textContent = 'Редактировать профиль';
            modalInput1.style.display = 'block';
            modalInput2.style.display = 'block';
            modalInput3.style.display = 'block';
            modalInput1.placeholder = 'Новое имя';
            modalInput2.placeholder = 'Новый логин';
            modalInput3.placeholder = 'Новый пароль (оставьте пустым)';
            modalInput1.value = '';
            modalInput2.value = '';
            modalInput3.value = '';
            
            editModal.style.display = 'flex';
            
            modalSaveBtn.onclick = async () => {
                const updates = {};
                if (modalInput1.value) updates.display_name = modalInput1.value;
                if (modalInput2.value) updates.username = modalInput2.value;
                if (modalInput3.value) updates.password = modalInput3.value;
                
                if (Object.keys(updates).length > 0) {
                    await supabaseClient
                        .from('users')
                        .update(updates)
                        .eq('id', currentUser.id);
                    
                    currentUser = { ...currentUser, ...updates };
                    updateProfilePanel();
                }
                
                editModal.style.display = 'none';
            };
        });

        changePasswordBtn.addEventListener('click', () => {
            modalTitle.textContent = 'Изменить пароль';
            modalInput1.style.display = 'none';
            modalInput2.style.display = 'none';
            modalInput3.style.display = 'block';
            modalInput3.placeholder = 'Новый пароль';
            modalInput3.value = '';
            
            editModal.style.display = 'flex';
            
            modalSaveBtn.onclick = async () => {
                if (modalInput3.value) {
                    await supabaseClient
                        .from('users')
                        .update({ password: modalInput3.value })
                        .eq('id', currentUser.id);
                    
                    currentUser.password = modalInput3.value;
                }
                editModal.style.display = 'none';
            };
        });

        modalCancelBtn.addEventListener('click', () => {
            editModal.style.display = 'none';
        });

        logoutBtn.addEventListener('click', () => {
            currentUser = null;
            authContainer.style.display = 'flex';
            mainContainer.style.display = 'none';
            loginInput.value = '';
            passwordInput.value = '';
            authError.textContent = '';
            
            if (messagesSubscription) supabaseClient.removeChannel(messagesSubscription);
            if (contactsSubscription) supabaseClient.removeChannel(contactsSubscription);
        });

        // ===============================================
        // АДМИН-ПАНЕЛЬ
        // ===============================================

        adminPanelBtn.addEventListener('click', async () => {
            if (currentUser && currentUser.username === 'German') {
                const { data: users } = await supabaseClient
                    .from('users')
                    .select('*')
                    .order('username');

                adminUsersGrid.innerHTML = users.map(user => `
                    <div style="background: #1a1a1a; border-radius: 16px; padding: 20px; border: 2px solid #333;">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 15px;">
                            <div style="font-size: 18px; font-weight: 600;">${user.display_name !== '---' ? user.display_name : user.username}</div>
                            <div style="display: flex; gap: 10px;">
                                <button onclick="editUser('${user.id}')" style="padding: 5px 10px; background: #0a0a0a; border: 1px solid #333; border-radius: 8px; color: #f0b90b; cursor: pointer;">✎</button>
                                <button onclick="toggleBlockUser('${user.id}', '${user.status}')" style="padding: 5px 10px; background: #0a0a0a; border: 1px solid #333; border-radius: 8px; color: ${user.status === 'blocked' ? '#4caf50' : '#ff4444'}; cursor: pointer;">${user.status === 'blocked' ? '🔓' : '🔒'}</button>
                            </div>
                        </div>
                        <div style="font-size: 14px; color: #888;">
                            <div>Логин: ${user.username}</div>
                            <div>ID: ${user.user_id_string}</div>
                            <div>Статус: ${user.status}</div>
                        </div>
                    </div>
                `).join('');

                adminPanel.style.display = 'block';
            }
        });

        window.toggleBlockUser = async function(userId, currentStatus) {
            const newStatus = currentStatus === 'blocked' ? 'active' : 'blocked';
            await supabaseClient
                .from('users')
                .update({ status: newStatus })
                .eq('id', userId);
            
            adminPanelBtn.click();
        };

        window.editUser = async function(userId) {
            modalTitle.textContent = 'Редактировать пользователя';
            modalInput1.style.display = 'block';
            modalInput2.style.display = 'block';
            modalInput3.style.display = 'block';
            modalInput1.placeholder = 'Новое имя';
            modalInput2.placeholder = 'Новый логин';
            modalInput3.placeholder = 'Новый пароль';
            modalInput1.value = '';
            modalInput2.value = '';
            modalInput3.value = '';
            
            editModal.style.display = 'flex';
            
            modalSaveBtn.onclick = async () => {
                const updates = {};
                if (modalInput1.value) updates.display_name = modalInput1.value;
                if (modalInput2.value) updates.username = modalInput2.value;
                if (modalInput3.value) updates.password = modalInput3.value;
                
                if (Object.keys(updates).length > 0) {
                    await supabaseClient
                        .from('users')
                        .update(updates)
                        .eq('id', userId);
                    
                    adminPanelBtn.click();
                }
                
                editModal.style.display = 'none';
            };
        };

        closeAdminBtn.addEventListener('click', () => {
            adminPanel.style.display = 'none';
        });

        // ===============================================
        // ВИДЕОКОНФЕРЕНЦИЯ
        // ===============================================

        conferenceBtn.addEventListener('click', async () => {
            if (currentUser.username !== 'German') {
                alert('Только администратор может начинать конференцию');
                return;
            }

            videoModal.style.display = 'flex';
            startConference();
        });

        async function startConference() {
            if (!LiveKit) {
                alert('LiveKit SDK не загружен');
                return;
            }

            try {
                room = new LiveKit.Room();

                room.on(LiveKit.RoomEvent.TrackSubscribed, (track, publication, participant) => {
                    if (track.kind === 'video') {
                        const wrapper = document.createElement('div');
                        wrapper.className = 'video-wrapper';
                        
                        const label = document.createElement('div');
                        label.className = 'video-label';
                        label.textContent = participant.identity;
                        
                        const videoEl = track.attach();
                        wrapper.appendChild(videoEl);
                        wrapper.appendChild(label);
                        videoGrid.appendChild(wrapper);
                    }
                });

                room.on(LiveKit.RoomEvent.TrackUnsubscribed, (track) => {
                    track.detach().forEach(el => el.remove());
                });

                await room.connect(LIVEKIT_URL, currentUser.livekit_token || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJleHAiOjE3ODE3OTA2NTIsImlkZW50aXR5IjoiYWRtaW4iLCJpc3MiOiJBUEk4aGZuaHc3WXlueE4iLCJuYmYiOjE3NzE3OTA2NTIsInN1YiI6ImFkbWluIiwidmlkZW8iOnsiY2FuUHVibGlzaCI6dHJ1ZSwiY2FuUHVibGlzaERhdGEiOnRydWUsImNhblN1YnNjcmliZSI6dHJ1ZSwicm9vbSI6InNlY3VyZS1zdGFjay0xazViOTUiLCJyb29tSm9pbiI6dHJ1ZX19.ZZJvSlcJ6euQOa9tiLvFOboyp2F0oMQkXUbCEKvB4R4', {
                    roomName: 'secure-stack-1k5b95'
                });

                await room.localParticipant.setCameraEnabled(true);
                await room.localParticipant.setMicrophoneEnabled(true);

            } catch (error) {
                console.error('Ошибка конференции:', error);
            }
        }

        videoMicBtn.addEventListener('click', async () => {
            if (room?.localParticipant) {
                const enabled = room.localParticipant.isMicrophoneEnabled;
                await room.localParticipant.setMicrophoneEnabled(!enabled);
                videoMicBtn.textContent = enabled ? '🎤 Вкл' : '🎤 Выкл';
            }
        });

        videoLeaveBtn.addEventListener('click', () => {
            if (room) {
                room.disconnect();
                videoGrid.innerHTML = '';
                videoModal.style.display = 'none';
            }
        });

        window.addEventListener('click', (e) => {
            if (e.target === editModal) editModal.style.display = 'none';
            if (e.target === videoModal) {
                if (room) {
                    room.disconnect();
                    videoGrid.innerHTML = '';
                }
                videoModal.style.display = 'none';
            }
        });
    </script>
</body>
</html>
