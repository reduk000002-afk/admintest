<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Binance Briefing</title>
  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #0a0a0a;
      color: #f0b90b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      height: 100vh;
    }

    h1 {
      margin: 20px 0;
      font-size: 2rem;
      color: #f0b90b;
    }

    #briefingContainer {
      width: 90%;
      max-width: 1000px;
      height: 600px;
      background: #1e1f25;
      border: 2px solid #f0b90b;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    button {
      background: #f0b90b;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      color: #0a0a0a;
      font-weight: bold;
      cursor: pointer;
      margin: 5px;
    }

    button:hover {
      background: #ffd53d;
    }

    #controls {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <h1>Binance Briefing</h1>

  <!-- Контейнер для Embed SDK -->
  <div id="briefingContainer"></div>

  <!-- Кастомные кнопки управления -->
  <div id="controls">
    <button id="micBtn">Включить микрофон</button>
    <button id="leaveBtn">Выйти из брифинга</button>
  </div>

  <!-- Подключаем Embed SDK -->
  <script src="https://cdn.whereby.dev/embed-sdk/1.3.0/whereby-embed.min.js"></script>
  <script>
    // Контейнер
    const container = document.getElementById("briefingContainer");

    // Вставляем свои данные
    const roomUrl = "https://whereby.com/briefing-room"; // твой roomUrl
    const roomKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJodHRwczovL2FjY291bnRzLmFwcGVhci5pbiIsImF1ZCI6Imh0dHBzOi8vYXBpLmFwcGVhci5pbi92MSIsImV4cCI6OTAwNzE5OTI1NDc0MDk5MSwiaWF0IjoxNzcxNzg2NTcwLCJvcmdhbml6YXRpb25JZCI6MzM1MjY5LCJqdGkiOiJlZDA1ODAxMy04N2U2LTQ0YmEtODk2OC1kYTQ5YmMwZjliM2UifQ.hsQAyMp2Y6rP1UGlqZ_BySqBnG1K7WEr19f3tFusi_o";
    const displayName = "Admin"; // Имя пользователя

    // Создаем Embed
    const embed = new WherebyEmbed(container, {
      roomUrl: roomUrl,
      roomKey: roomKey,
      displayName: displayName,
      hidePeople: true,   // скрываем список участников
      hideChat: true,     // скрываем чат
      showMic: true,      // включаем микрофон
      showVideo: false    // отключаем камеру по умолчанию
    });

    // Кастомная кнопка микрофона
    const micBtn = document.getElementById("micBtn");
    micBtn.onclick = () => {
      const micState = embed.getMicState();
      embed.setMicEnabled(!micState);
      micBtn.innerText = micState ? "Включить микрофон" : "Выключить микрофон";
    };

    // Кнопка выхода
    const leaveBtn = document.getElementById("leaveBtn");
    leaveBtn.onclick = () => {
      embed.leave();
      alert("Вы вышли из брифинга");
    };
  </script>
</body>
</html>
