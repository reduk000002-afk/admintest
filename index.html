            padding: 0;
            box-sizing: border-box;

        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-box {
            background: #1a1a1a;
            border: 2px solid #f0b90b;
            border-radius: 32px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(240, 185, 11, 0.1);
        }

        .auth-title {
            font-size: 24px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        .auth-input {
            width: 100%;
            padding: 15px 20px;
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 16px;
            color: #f0b90b;
            font-size: 16px;
            margin-bottom: 15px;
            transition: all 0.3s;
        }

        .auth-input:focus {
            outline: none;
            border-color: #f0b90b;
            box-shadow: 0 0 0 2px rgba(240, 185, 11, 0.2);
        }

        .auth-btn {
            width: 100%;
            padding: 15px;
            background: #f0b90b;
            border: none;
            border-radius: 16px;
            color: #0a0a0a;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .auth-btn:hover {
            background: #ffd700;
            transform: translateY(-2px);

            height: 100vh;
            grid-template-columns: 280px 1fr 320px;
            background: #0a0a0a;

            background: #111;

            padding: 20px 0;
            overflow-y: auto;

        }

        .panel-title {
            font-size: 18px;
            font-weight: 600;
            color: #f0b90b;

            color: #0a0a0a;
            font-weight: 600;

            padding: 12px 20px;

            transition: all 0.2s;
            border-left: 3px solid transparent;
            position: relative;

        .chat-item:hover {
            background: #1a1a1a;
        }

        .chat-item.active {
            background: #1a1a1a;
            border-left-color: #f0b90b;
        }

            content: '';
            position: absolute;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            width: 10px;
            height: 10px;
            background: #f0b90b;
            border-radius: 50%;

        .chat-avatar {

            height: 40px;

        .modal {

        .video-container {

        const SUPABASE_URL = 'https://mqqlcfcwufdqwslukziy.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_pj766xnnI6WD4kiw7_kSSg_oaIiSYIr';

        async function checkSavedSession() {
            const savedUser = localStorage.getItem('currentUser');
            if (savedUser) {
                try {
                    currentUser = JSON.parse(savedUser);
                    
                    const { data: user, error } = await supabaseClient
                        .from('users')
                        .select('*')
                        .eq('id', currentUser.id)
                        .single();

                        currentUser = user;

        // ===============================================
        // АВТОРИЗАЦИЯ
        // ===============================================

        loginBtn.addEventListener('click', async () => {
            const username = loginInput.value.trim();
            const password = passwordInput.value.trim();

            if (!username || !password) {
                authError.textContent = 'Введите логин и пароль';
                return;
            }

            try {
                const { data: users, error } = await supabaseClient
                    .from('users')
                    .select('*')
                    .eq('username', username)
                    .eq('password', password);

                if (error) throw error;

                if (users && users.length > 0) {
                    const user = users[0];
                    
                    if (user.status === 'blocked') {
                        authError.textContent = 'Пользователь заблокирован';
                        return;
                    }

                    currentUser = user;
                    localStorage.setItem('currentUser', JSON.stringify(user));
                    
                    authContainer.style.display = 'none';
                    mainContainer.style.display = 'grid';
                    
                    if (user.username === 'German') {
                        adminPanelBtn.style.display = 'block';
                    }
                    
                    updateProfilePanel();
                    loadChats();
                    setupRealtimeSubscriptions();
                } else {
                    authError.textContent = 'Неверный логин или пароль';
                }
            } catch (error) {
                console.error('Ошибка авторизации:', error);
                authError.textContent = 'Ошибка подключения к базе';
            }
        });

        // ===============================================
        // НАСТРОЙКА ПОДПИСОК (РИАЛТАЙМ)
        // ===============================================

        function setupRealtimeSubscriptions() {
            // Подписка на личные сообщения
            const messagesChannel = supabaseClient
                .channel('messages-channel')
                .on('postgres_changes', 
                    { 
                        event: 'INSERT', 
                        schema: 'public', 
                        table: 'private_messages',
                        filter: `receiver_id=eq.${currentUser.id}`
                    },
                    async (payload) => {
                        console.log('Новое сообщение получено:', payload);
                        
                        const { data: sender } = await supabaseClient
                            .from('users')
                            .select('*')
                            .eq('id', payload.new.sender_id)
                            .single();
                        
                        await addToContactsIfNotExists(sender);
                        
                        if (currentChat === payload.new.sender_id && currentChatType === 'private') {
                            loadPrivateMessages(currentChat);
                        } else {
                            unreadCounts[`private_${payload.new.sender_id}`] = (unreadCounts[`private_${payload.new.sender_id}`] || 0) + 1;
                        }
                        loadChats();
                    }
                )
                .on('postgres_changes',
                    { 
                        event: 'INSERT', 
                        schema: 'public', 
                        table: 'private_messages',
                        filter: `sender_id=eq.${currentUser.id}`
                    },
                    (payload) => {
                        if (currentChat === payload.new.receiver_id && currentChatType === 'private') {
                            loadPrivateMessages(currentChat);
                        }
                    }
                )
                .subscribe();

            // Подписка на групповые сообщения
            const groupChannel = supabaseClient
                .channel('group-channel')
                .on('postgres_changes',
                    { 
                        event: 'INSERT', 
                        schema: 'public', 
                        table: 'group_messages'
                    },
                    (payload) => {
                        if (currentChatType === 'group') {
                            loadGroupMessages();
                        } else {
                            unreadCounts['group'] = (unreadCounts['group'] || 0) + 1;
                            loadChats();
                        }
                    }
                )
                .subscribe();

            // Подписка на изменения в контактах
            const contactsChannel = supabaseClient
                .channel('contacts-channel')
                .on('postgres_changes',
                    { 
                        event: '*', 
                        schema: 'public', 
                        table: 'user_contacts',
                        filter: `user_id=eq.${currentUser.id}`
                    },
                    () => {
                        loadChats();
                    }
                )
                .subscribe();

            // Если админ, подписываемся на изменения пользователей
            if (currentUser.username === 'German') {
                const adminChannel = supabaseClient
                    .channel('admin-channel')
                    .on('postgres_changes',
                        { 
                            event: '*', 
                            schema: 'public', 
                            table: 'users'
                        },
                        () => {
                            if (adminPanel.style.display === 'block') {
                                loadAdminUsers();
                            }
                        }
                    )
                    .subscribe();
            }
        }

        // ===============================================
        // ЗАГРУЗКА ЧАТОВ
        // ===============================================

        async function loadChats() {
            try {
                // Загружаем группу
                const chats = [];
                
                // Добавляем группу если пользователь в ней
                if (currentUser.in_group) {
                    const { data: lastGroupMsg } = await supabaseClient
                        .from('group_messages')
                        .select('*')
                        .order('created_at', { ascending: false })
                        .limit(1)
                        .maybeSingle();

                    chats.push({
                        id: GROUP_ID,
                        name: GROUP_NAME,
                        type: 'group',
                        avatar: '👥',
                        lastMessage: lastGroupMsg,
                        unread: unreadCounts['group'] || 0
                    });
                }

                // Загружаем личные контакты
                const { data: contacts, error } = await supabaseClient
                    .from('user_contacts')
                    .select('contact_id, users!user_contacts_contact_id_fkey(*)')
                    .eq('user_id', currentUser.id);

                if (error) throw error;

                const contactUsers = contacts.map(c => c.users).filter(u => u);
                
                const contactsWithLastMessage = await Promise.all(
                    contactUsers.map(async (contact) => {
                        const { data: lastMsg } = await supabaseClient
                            .from('private_messages')
                            .select('*')
                            .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${contact.id}),and(sender_id.eq.${contact.id},receiver_id.eq.${currentUser.id})`)
                            .order('created_at', { ascending: false })
                            .limit(1)
                            .maybeSingle();
                        
                        return {
                            id: contact.id,
                            name: contact.display_name !== '---' ? contact.display_name : contact.username,
                            type: 'private',
                            avatar: contact.display_name !== '---' ? contact.display_name[0] : contact.username[0].toUpperCase(),
                            userId: contact.user_id_string,
                            lastMessage: lastMsg,
                            unread: unreadCounts[`private_${contact.id}`] || 0
                        };
                    })
                );

                renderChatList([...chats, ...contactsWithLastMessage]);
            } catch (error) {
                console.error('Ошибка загрузки чатов:', error);
            }
        }

        function renderChatList(chats) {
            chatList.innerHTML = chats.map(chat => {
                const time = chat.lastMessage ? new Date(chat.lastMessage.created_at).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }) : '';
                const lastMessageText = chat.lastMessage ? 
                    (chat.lastMessage.sender_id === currentUser.id ? 'Вы: ' : '') + chat.lastMessage.message : 
                    'Нет сообщений';
                
                return `
                    <div class="chat-item ${currentChat === chat.id ? 'active' : ''} ${chat.unread > 0 ? 'unread' : ''}" onclick="selectChat('${chat.id}', '${chat.type}')">
                        <div class="chat-avatar ${chat.type === 'group' ? 'group' : ''}">${chat.avatar}</div>
                        <div class="chat-info">
                            <div class="chat-name">${chat.name}</div>
                            ${chat.type === 'private' ? `<div class="chat-id">ID: ${chat.userId}</div>` : ''}
                            <div class="last-message">${lastMessageText.substring(0, 30)}${lastMessageText.length > 30 ? '...' : ''} ${time ? '· ' + time : ''}</div>
                        </div>
                        ${chat.unread > 0 ? `<div class="unread-badge">${chat.unread}</div>` : ''}
                    </div>
                `;
            }).join('');
        }

        window.selectChat = function(chatId, type) {
            currentChat = chatId;
            currentChatType = type;
            
            if (type === 'group') {
                currentChatTitle.textContent = GROUP_NAME;
                loadGroupMessages();
                unreadCounts['group'] = 0;
                
                // Показываем кнопку конференции
                conferenceBtn.style.display = 'block';
                if (currentUser.username === 'German') {
                    conferenceBtn.textContent = 'Начать конференцию';
                    conferenceBtn.classList.remove('join');
                } else {
                    conferenceBtn.textContent = 'Подключиться к конференции';
                    conferenceBtn.classList.add('join');
                }
            } else {
                // Получаем имя пользователя
                const chatElement = document.querySelector(`[onclick="selectChat('${chatId}', 'private')"] .chat-name`);
                const userName = chatElement ? chatElement.textContent : 'Пользователь';
                currentChatTitle.textContent = `Чат с ${userName}`;
                loadPrivateMessages(chatId);
                unreadCounts[`private_${chatId}`] = 0;
                conferenceBtn.style.display = 'none';
            }
            
            messageInput.disabled = false;
            sendBtn.disabled = false;
            messageInput.focus();
            loadChats();
        };

        // ===============================================
        // ЗАГРУЗКА СООБЩЕНИЙ
        // ===============================================

        async function loadGroupMessages() {
            try {
                const { data: messages, error } = await supabaseClient
                    .from('group_messages')
                    .select('*, users!inner(*)')
                    .order('created_at', { ascending: true });

                if (error) throw error;

                renderMessages(messages || [], 'group');
            } catch (error) {
                console.error('Ошибка загрузки сообщений:', error);
            }
        }

        async function loadPrivateMessages(otherUserId) {
            try {
                const { data: messages, error } = await supabaseClient
                    .from('private_messages')
                    .select('*, sender:sender_id(*)')
                    .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${otherUserId}),and(sender_id.eq.${otherUserId},receiver_id.eq.${currentUser.id})`)
                    .order('created_at', { ascending: true });

                if (error) throw error;

                renderMessages(messages || [], 'private');
            } catch (error) {
                console.error('Ошибка загрузки сообщений:', error);
            }
        }

        function renderMessages(messages, type) {
            if (!messages || messages.length === 0) {
                messagesContainer.innerHTML = '<div style="text-align: center; color: #666; margin-top: 50px;">Нет сообщений. Напишите первое сообщение!</div>';
                return;
            }

            messagesContainer.innerHTML = messages.map(msg => {
                let isOwn, senderName, sender;
                
                if (type === 'group') {
                    isOwn = msg.user_id === currentUser.id;
                    sender = msg.users || {};
                    senderName = isOwn ? 'Вы' : (sender.display_name !== '---' ? sender.display_name : sender.username);
                } else {
                    isOwn = msg.sender_id === currentUser.id;
                    sender = msg.sender || {};
                    senderName = isOwn ? 'Вы' : (sender.display_name !== '---' ? sender.display_name : sender.username);
                }
                
                const time = new Date(msg.created_at).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
                
                return `
                    <div class="message ${isOwn ? 'own' : ''}">
                        <div class="message-header">
                            <span class="message-sender">${senderName}</span>
                            <span class="message-time">${time}</span>
                        </div>
                        <div class="message-content">${msg.message || msg.text}</div>
                    </div>
                `;
            }).join('');
            
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // ===============================================
        // ОТПРАВКА СООБЩЕНИЙ
        // ===============================================

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text || !currentChat) {
                if (!currentChat) alert('Выберите чат');
                return;
            }

            try {
                if (currentChatType === 'group') {
                    await supabaseClient
                        .from('group_messages')
                        .insert([{
                            user_id: currentUser.id,
                            message: text,
                            created_at: new Date()
                        }]);
                } else {
                    await supabaseClient
                        .from('private_messages')
                        .insert([{
                            sender_id: currentUser.id,
                            receiver_id: currentChat,
                            message: text,
                            created_at: new Date()
                        }]);
                }

                messageInput.value = '';
            } catch (error) {
                console.error('Ошибка отправки:', error);
                alert('Ошибка при отправке сообщения');
            }
        }

        // ===============================================
        // ПОИСК ПОЛЬЗОВАТЕЛЕЙ ПО ID
        // ===============================================

        searchBtn.addEventListener('click', searchUserById);
        userSearch.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchUserById();
        });

        async function searchUserById() {
            const searchId = userSearch.value.trim();
            
            if (!searchId || searchId.length !== 7 || !/^\d+$/.test(searchId)) {
                alert('Введите 7-значный ID (только цифры)');
                return;
            }

            try {
                const { data: users, error } = await supabaseClient
                    .from('users')
                    .select('*')
                    .eq('user_id_string', searchId)
                    .neq('id', currentUser.id);

                if (error) throw error;

                if (users && users.length > 0) {
                    const foundUser = users[0];
                    await addToContactsIfNotExists(foundUser);
                    userSearch.value = '';
                } else {
                    alert('Пользователь с ID ' + searchId + ' не найден');
                }
            } catch (error) {
                console.error('Ошибка поиска:', error);
                alert('Ошибка при поиске пользователя');
            }
        }

        async function addToContactsIfNotExists(user) {
            if (!user) return;

            const { data: existingContact } = await supabaseClient
                .from('user_contacts')
                .select('*')
                .eq('user_id', currentUser.id)
                .eq('contact_id', user.id)
                .maybeSingle();

            if (!existingContact) {
                await supabaseClient
                    .from('user_contacts')
                    .insert([{
                        user_id: currentUser.id,
                        contact_id: user.id
                    }]);
            }
        }

        // ===============================================
        // ПРОФИЛЬ
        // ===============================================

        function updateProfilePanel() {
            if (!currentUser) return;

            profileName.textContent = currentUser.display_name !== '---' ? currentUser.display_name : currentUser.username;
            profileId.textContent = `ID: ${currentUser.user_id_string}`;
            profileLogin.textContent = currentUser.username;
            profileStatus.textContent = currentUser.status === 'active' ? 'Активен' : 'Заблокирован';
            profileMyId.textContent = currentUser.user_id_string;
            profileInGroup.textContent = currentUser.in_group ? 'Да' : 'Нет';
            profileAvatar.textContent = currentUser.display_name !== '---' ? currentUser.display_name[0] : currentUser.username[0].toUpperCase();
        }

        editProfileBtn.addEventListener('click', () => {
            modalTitle.textContent = 'Редактировать профиль';
            modalInput1.style.display = 'block';
            modalInput2.style.display = 'block';
            modalInput3.style.display = 'block';
            modalInput1.placeholder = 'Новое имя';
            modalInput2.placeholder = 'Новый логин';
            modalInput3.placeholder = 'Новый пароль (оставьте пустым)';
            modalInput1.value = '';
            modalInput2.value = '';
            modalInput3.value = '';
            
            editModal.style.display = 'flex';
            
            modalSaveBtn.onclick = async () => {
                const updates = {};
                if (modalInput1.value) updates.display_name = modalInput1.value;
                if (modalInput2.value) updates.username = modalInput2.value;
                if (modalInput3.value) updates.password = modalInput3.value;
                
                if (Object.keys(updates).length > 0) {
                    await supabaseClient
                        .from('users')
                        .update(updates)
                        .eq('id', currentUser.id);
                    
                    currentUser = { ...currentUser, ...updates };
                    localStorage.setItem('currentUser', JSON.stringify(currentUser));
                    updateProfilePanel();
                }
                
                editModal.style.display = 'none';
            };
        });

        changePasswordBtn.addEventListener('click', () => {
            modalTitle.textContent = 'Изменить пароль';
            modalInput1.style.display = 'none';
            modalInput2.style.display = 'none';
            modalInput3.style.display = 'block';
            modalInput3.placeholder = 'Новый пароль';
            modalInput3.value = '';
            
            editModal.style.display = 'flex';
            
            modalSaveBtn.onclick = async () => {
                if (modalInput3.value) {
                    await supabaseClient
                        .from('users')
                        .update({ password: modalInput3.value })
                        .eq('id', currentUser.id);
                    
                    currentUser.password = modalInput3.value;
                    localStorage.setItem('currentUser', JSON.stringify(currentUser));
                }
                editModal.style.display = 'none';
            };
        });

        modalCancelBtn.addEventListener('click', () => {
            editModal.style.display = 'none';
        });

        logoutBtn.addEventListener('click', () => {
            localStorage.removeItem('currentUser');
            currentUser = null;
            authContainer.style.display = 'flex';
            mainContainer.style.display = 'none';
            loginInput.value = '';
            passwordInput.value = '';
            authError.textContent = '';
            chatList.innerHTML = '';
            messagesContainer.innerHTML = '';
            messageInput.disabled = true;
            sendBtn.disabled = true;
            conferenceBtn.style.display = 'none';
            
            if (messagesSubscription) supabaseClient.removeChannel(messagesSubscription);
            if (contactsSubscription) supabaseClient.removeChannel(contactsSubscription);
        });

        // ===============================================
        // АДМИН-ПАНЕЛЬ
        // ===============================================

        adminPanelBtn.addEventListener('click', async () => {
            if (currentUser && currentUser.username === 'German') {
                await loadAdminUsers();
                adminPanel.style.display = 'block';
            }
        });

        closeAdminBtn.addEventListener('click', () => {
            adminPanel.style.display = 'none';
        });

        async function loadAdminUsers() {
            try {
                const { data: users, error } = await supabaseClient
                    .from('users')
                    .select('*')
                    .order('username');

                if (error) throw error;

                renderAdminUsers(users);
            } catch (error) {
                console.error('Ошибка загрузки пользователей:', error);
            }
        }

        function renderAdminUsers(users) {
            adminUsersGrid.innerHTML = users.map(user => `
                <div class="admin-user-card ${user.color_mark === 'red' ? 'marked-red' : user.color_mark === 'green' ? 'marked-green' : ''}">
                    <div class="admin-user-header">
                        <div class="admin-user-name">${user.display_name !== '---' ? user.display_name : user.username}</div>
                        <div class="admin-user-actions">
                            <button class="admin-user-btn" onclick="impersonateUser('${user.id}')">👤 Войти</button>
                            <button class="admin-user-btn ${user.in_group ? 'group' : ''}" onclick="toggleGroup('${user.id}', ${user.in_group})">
                                ${user.in_group ? '✓ В группе' : '➕ В группу'}
                            </button>
                            <button class="admin-user-btn" onclick="editUser('${user.id}')">✎</button>
                            <button class="admin-user-btn" onclick="toggleBlockUser('${user.id}', '${user.status}')">${user.status === 'blocked' ? '🔓' : '🔒'}</button>
                        </div>
                    </div>
                    
                    <div class="color-buttons">
                        <button class="color-btn red" onclick="markUser('${user.id}', 'red')">Красный</button>
                        <button class="color-btn green" onclick="markUser('${user.id}', 'green')">Зеленый</button>
                        <button class="color-btn clear" onclick="markUser('${user.id}', null)">Очистить</button>
                    </div>

                    <div style="margin: 10px 0; font-size: 14px;">
                        <div><strong>Логин:</strong> ${user.username}</div>
                        <div><strong>ID:</strong> ${user.user_id_string}</div>
                        <div><strong>Статус:</strong> ${user.status}</div>
                        <div><strong>В группе:</strong> ${user.in_group ? 'Да' : 'Нет'}</div>
                    </div>

                    <div style="margin: 10px 0;">
                        <input type="text" class="token-input" id="token-${user.id}" placeholder="LiveKit URL" value="${user.livekit_url || ''}">
                        <input type="text" class="token-input" id="token-value-${user.id}" placeholder="LiveKit Токен" value="${user.livekit_token || ''}">
                        <button class="admin-user-btn" style="width: 100%; margin-top: 5px;" onclick="saveLiveKitToken('${user.id}')">💾 Сохранить токен</button>
                    </div>
                </div>
            `).join('');
        }

        window.markUser = async function(userId, color) {
            await supabaseClient
                .from('users')
                .update({ color_mark: color })
                .eq('id', userId);
            
            loadAdminUsers();
        };

        window.toggleBlockUser = async function(userId, currentStatus) {
            const newStatus = currentStatus === 'blocked' ? 'active' : 'blocked';
            await supabaseClient
                .from('users')
                .update({ status: newStatus })
                .eq('id', userId);
            
            loadAdminUsers();
        };

        window.toggleGroup = async function(userId, inGroup) {
            await supabaseClient
                .from('users')
                .update({ in_group: !inGroup })
                .eq('id', userId);
            
            loadAdminUsers();
        };

        window.impersonateUser = async function(userId) {
            const { data: user, error } = await supabaseClient
                .from('users')
                .select('*')
                .eq('id', userId)
                .single();

            if (!error && user) {
                // Открываем в новой вкладке
                const newWindow = window.open('about:blank', '_blank');
                if (newWindow) {
                    newWindow.document.write(`
                        <!DOCTYPE html>
                        <html>
                        <head>
                            <title>Secure Briefing - ${user.username}</title>
                            <style>
                                body {
                                    background: #0a0a0a;
                                    color: #f0b90b;
                                    font-family: 'Segoe UI', sans-serif;
                                    display: flex;
                                    align-items: center;
                                    justify-content: center;
                                    height: 100vh;
                                    margin: 0;
                                }
                                .loading {
                                    text-align: center;
                                }
                                .spinner {
                                    border: 4px solid #333;
                                    border-top: 4px solid #f0b90b;
                                    border-radius: 50%;
                                    width: 40px;
                                    height: 40px;
                                    animation: spin 1s linear infinite;
                                    margin: 20px auto;
                                }
                                @keyframes spin {
                                    0% { transform: rotate(0deg); }
                                    100% { transform: rotate(360deg); }
                                }
                            </style>
                        </head>
                        <body>
                            <div class="loading">
                                <h2>Загрузка сессии пользователя ${user.username}</h2>
                                <div class="spinner"></div>
                                <p>Пожалуйста, подождите...</p>
                            </div>
                        </body>
                        </html>
                    `);
                    
                    // Сохраняем данные для новой вкладки
                    localStorage.setItem('impersonateUser', JSON.stringify({
                        user: user,
                        admin: currentUser
                    }));
                    
                    // Перенаправляем на основную страницу через секунду
                    setTimeout(() => {
                        newWindow.location.href = window.location.href;
                    }, 1000);
                }
            }
        };

        window.editUser = async function(userId) {
            const { data: user } = await supabaseClient
                .from('users')
                .select('*')
                .eq('id', userId)
                .single();

            modalTitle.textContent = `Редактировать ${user.username}`;
            modalInput1.style.display = 'block';
            modalInput2.style.display = 'block';
            modalInput3.style.display = 'block';
            modalInput1.placeholder = 'Новое имя';
            modalInput2.placeholder = 'Новый логин';
            modalInput3.placeholder = 'Новый пароль';
            modalInput1.value = '';
            modalInput2.value = '';
            modalInput3.value = '';
            
            editModal.style.display = 'flex';
            
            modalSaveBtn.onclick = async () => {
                const updates = {};
                if (modalInput1.value) updates.display_name = modalInput1.value;
                if (modalInput2.value) updates.username = modalInput2.value;
                if (modalInput3.value) updates.password = modalInput3.value;
                
                if (Object.keys(updates).length > 0) {
                    await supabaseClient
                        .from('users')
                        .update(updates)
                        .eq('id', userId);
                    
                    loadAdminUsers();
                }
                
                editModal.style.display = 'none';
            };
        };

        window.saveLiveKitToken = async function(userId) {
            const url = document.getElementById(`token-${userId}`).value;
            const token = document.getElementById(`token-value-${userId}`).value;
            
            await supabaseClient
                .from('users')
                .update({ 
                    livekit_url: url,
                    livekit_token: token 
                })
                .eq('id', userId);
            
            alert('Токен сохранен!');
            loadAdminUsers();
        };

        // ===============================================
        // ВИДЕОКОНФЕРЕНЦИЯ
        // ===============================================

        conferenceBtn.addEventListener('click', async () => {
            if (!currentUser.livekit_token) {
                alert('У вас нет токена для конференции');
                return;
            }

            videoModal.style.display = 'flex';
            startConference();
        });

        async function startConference() {
            if (!LiveKit) {
                alert('LiveKit SDK не загружен');
                return;
            }

            try {
                room = new LiveKit.Room();

                room.on(LiveKit.RoomEvent.TrackSubscribed, (track, publication, participant) => {
                    if (track.kind === 'video') {
                        const wrapper = document.createElement('div');
                        wrapper.className = 'video-wrapper';
                        
                        const label = document.createElement('div');
                        label.className = 'video-label';
                        label.textContent = participant.identity;
                        
                        const videoEl = track.attach();
                        wrapper.appendChild(videoEl);
                        wrapper.appendChild(label);
                        videoGrid.appendChild(wrapper);
                    }
                });

                room.on(LiveKit.RoomEvent.TrackUnsubscribed, (track) => {
                    track.detach().forEach(el => el.remove());
                });

                await room.connect(currentUser.livekit_url || LIVEKIT_URL, currentUser.livekit_token, {
                    roomName: 'secure-stack-1k5b95'
                });

                await room.localParticipant.setCameraEnabled(true);
                await room.localParticipant.setMicrophoneEnabled(true);

            } catch (error) {
                console.error('Ошибка конференции:', error);
                alert('Ошибка подключения к конференции: ' + error.message);
            }
        }

        videoMicBtn.addEventListener('click', async () => {
            if (room?.localParticipant) {
                const enabled = room.localParticipant.isMicrophoneEnabled;
                await room.localParticipant.setMicrophoneEnabled(!enabled);
                videoMicBtn.textContent = enabled ? '🎤 Вкл' : '🎤 Выкл';
            }
        });

        videoLeaveBtn.addEventListener('click', () => {
            if (room) {
                room.disconnect();
                videoGrid.innerHTML = '';
                videoModal.style.display = 'none';
            }
        });

        window.addEventListener('click', (e) => {
            if (e.target === editModal) editModal.style.display = 'none';
            if (e.target === videoModal) {
                if (room) {
                    room.disconnect();
                    videoGrid.innerHTML = '';
                }
                videoModal.style.display = 'none';
            }
        });

        // Проверяем, не открыта ли страница для имперсонации
        (function checkImpersonation() {
            const impersonateData = localStorage.getItem('impersonateUser');
            if (impersonateData) {
                const { user, admin } = JSON.parse(impersonateData);
                localStorage.removeItem('impersonateUser');
                
                // Устанавливаем пользователя
                currentUser = user;
                localStorage.setItem('currentUser', JSON.stringify(user));
                
                // Показываем интерфейс
                setTimeout(() => {
                    authContainer.style.display = 'none';
                    mainContainer.style.display = 'grid';
                    
                    if (user.username === 'German') {
                        adminPanelBtn.style.display = 'block';
                    }
                    
                    updateProfilePanel();
                    loadChats();
                    setupRealtimeSubscriptions();
                }, 500);
            }
        })();

        // Запускаем проверку сохраненной сессии при загрузке
        checkSavedSession();
    </script>
</body>
</html>
