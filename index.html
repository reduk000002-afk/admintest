<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Secure Briefing</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: #f0b90b;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Авторизация */
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-box {
            background: #1a1a1a;
            border: 2px solid #f0b90b;
            border-radius: 32px;
            padding: 40px 20px;
            width: 100%;
            max-width: 400px;
        }

        .auth-title {
            font-size: 24px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-input {
            width: 100%;
            padding: 15px 20px;
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 16px;
            color: #f0b90b;
            font-size: 16px;
            margin-bottom: 15px;
        }

        .auth-btn {
            width: 100%;
            padding: 15px;
            background: #f0b90b;
            border: none;
            border-radius: 16px;
            color: #0a0a0a;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Основной интерфейс */
        .main-container {
            display: none;
            height: 100vh;
            grid-template-columns: 400px 1fr 320px;
            background: #0a0a0a;
            position: relative;
            overflow: hidden;
        }

        /* Мобильная версия */
        @media (max-width: 768px) {
            .main-container {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr;
                height: 100vh;
                overflow: hidden;
            }

            .users-panel {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                z-index: 100;
                background: #111;
                transform: translateX(-100%);
                transition: transform 0.3s ease;
                overflow-y: auto;
                width: 90%;
                max-width: 350px;
            }

            .users-panel.active {
                transform: translateX(0);
                box-shadow: 2px 0 10px rgba(0,0,0,0.5);
            }

            .profile-panel {
                position: fixed;
                top: 0;
                right: 0;
                bottom: 0;
                width: 90%;
                max-width: 350px;
                z-index: 100;
                background: #111;
                transform: translateX(100%);
                transition: transform 0.3s ease;
                overflow-y: auto;
                border-left: 1px solid #333;
            }

            .profile-panel.active {
                transform: translateX(0);
                box-shadow: -2px 0 10px rgba(0,0,0,0.5);
            }

            .mobile-overlay {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(0,0,0,0.5);
                z-index: 95;
            }

            .mobile-overlay.active {
                display: block;
            }

            .chat-panel {
                height: 100vh;
                display: flex;
                flex-direction: column;
                background: #0a0a0a;
                position: relative;
                overflow: hidden;
            }

            .chat-header {
                height: 70px; /* Увеличил высоту */
                background: #111;
                border-bottom: 1px solid #333;
                padding: 0 15px;
                display: flex;
                align-items: center;
                gap: 10px;
                flex-shrink: 0;
                position: sticky;
                top: 0;
                z-index: 10;
            }

            .chat-header .back-btn {
                display: flex;
                width: 44px;
                height: 44px;
                align-items: center;
                justify-content: center;
                font-size: 26px;
                cursor: pointer;
                color: #f0b90b;
                border-radius: 50%;
                flex-shrink: 0;
            }

            .chat-header .back-btn:active {
                background: #1a1a1a;
            }

            .chat-header .chat-title {
                flex: 1;
                font-size: 18px;
                font-weight: 600;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                margin: 0 4px;
            }

            .chat-header .conference-btn {
                font-size: 22px;
                padding: 8px 15px;
                white-space: nowrap;
                background: transparent;
                border: 2px solid #f0b90b;
                color: #f0b90b;
                border-radius: 24px;
                flex-shrink: 0;
                height: 44px;
                display: flex;
                align-items: center;
            }

            .messages-wrapper {
                flex: 1;
                overflow-y: auto;
                padding: 15px;
                display: flex;
                flex-direction: column;
                gap: 12px;
            }

            .message {
                max-width: 85%;
            }

            .message-content {
                padding: 12px 16px;
                font-size: 16px;
                line-height: 1.4;
            }

            .empty-messages {
                text-align: center;
                color: #666;
                margin-top: 30px;
                font-size: 16px;
                padding: 20px;
            }

            .chat-input-area {
                background: #111;
                border-top: 1px solid #333;
                padding: 12px 15px;
                display: flex;
                gap: 10px;
                align-items: flex-end;
                flex-shrink: 0;
                min-height: 70px; /* Увеличил высоту */
                position: sticky;
                bottom: 0;
                z-index: 10;
            }

            .chat-input {
                flex: 1;
                padding: 12px 16px;
                background: #1a1a1a;
                border: 1px solid #333;
                border-radius: 24px;
                color: #f0b90b;
                font-size: 16px;
                line-height: 1.4;
                max-height: 120px;
                resize: none;
                font-family: inherit;
            }

            .chat-input:focus {
                outline: none;
                border-color: #f0b90b;
            }

            .send-btn {
                width: 48px;
                height: 48px;
                border-radius: 50%;
                background: #f0b90b;
                border: none;
                color: #0a0a0a;
                font-size: 22px;
                font-weight: 600;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                flex-shrink: 0;
            }

            .send-btn:disabled {
                opacity: 0.5;
                background: #333;
                cursor: not-allowed;
            }

            .mobile-menu-btn {
                display: flex;
                position: fixed;
                bottom: 20px;
                right: 20px;
                width: 60px;
                height: 60px;
                border-radius: 50%;
                background: #f0b90b;
                color: #0a0a0a;
                align-items: center;
                justify-content: center;
                font-size: 30px;
                border: none;
                z-index: 90;
                box-shadow: 0 4px 12px rgba(240, 185, 11, 0.3);
            }
        }

        /* Десктоп версия */
        .mobile-header, .mobile-menu-btn, .mobile-overlay {
            display: none;
        }

        .users-panel {
            background: #111;
            border-right: 1px solid #333;
            padding: 20px 0;
            overflow-y: auto;
            height: 100vh;
        }

        .panel-header {
            padding: 0 20px 20px;
            border-bottom: 1px solid #333;
        }

        .panel-title {
            font-size: 18px;
            font-weight: 600;
            color: #f0b90b;
            margin-bottom: 15px;
        }

        .search-container {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .search-input {
            flex: 1;
            padding: 10px 15px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            color: #f0b90b;
            font-size: 14px;
        }

        .search-btn {
            padding: 10px 20px;
            background: #f0b90b;
            border: none;
            border-radius: 12px;
            color: #0a0a0a;
            font-weight: 600;
            cursor: pointer;
        }

        .chat-list {
            padding: 10px 0;
        }

        .chat-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            cursor: pointer;
            border-left: 3px solid transparent;
            position: relative;
        }

        .chat-item:hover {
            background: #1a1a1a;
        }

        .chat-item.active {
            background: #1a1a1a;
            border-left-color: #f0b90b;
        }

        .chat-avatar {
            width: 40px;
            height: 40px;
            background: #222;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f0b90b;
            font-weight: 600;
            border: 2px solid #f0b90b;
        }

        .chat-avatar.group {
            background: #f0b90b;
            color: #0a0a0a;
            font-size: 20px; /* Для иконки с деньгами */
        }

        .chat-info {
            flex: 1;
        }

        .chat-name {
            color: #fff;
            font-size: 14px;
            font-weight: 500;
        }

        .chat-id {
            color: #888;
            font-size: 12px;
        }

        .last-message {
            color: #666;
            font-size: 11px;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 250px;
        }

        .chat-panel {
            display: flex;
            flex-direction: column;
            background: #0a0a0a;
            height: 100vh;
            overflow: hidden;
        }

        .chat-header {
            padding: 20px 25px; /* Увеличил отступы */
            border-bottom: 1px solid #333;
            display: flex;
            align-items: center;
            gap: 15px;
            background: #111;
            flex-shrink: 0;
            height: 80px; /* Увеличил высоту */
        }

        .chat-header .back-btn {
            display: flex;
            width: 44px;
            height: 44px;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            cursor: pointer;
            color: #f0b90b;
            border-radius: 50%;
        }

        .chat-header .back-btn:hover {
            background: #1a1a1a;
        }

        .chat-title {
            flex: 1;
            font-size: 20px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .conference-btn {
            background: #f0b90b;
            color: #0a0a0a;
            border: none;
            padding: 10px 20px;
            border-radius: 24px;
            font-weight: 600;
            cursor: pointer;
            font-size: 15px;
            flex-shrink: 0;
            height: 44px;
            display: flex;
            align-items: center;
        }

        .conference-btn.join {
            background: transparent;
            border: 2px solid #f0b90b;
            color: #f0b90b;
        }

        .messages-wrapper {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-height: 0;
        }

        .empty-messages {
            text-align: center;
            color: #666;
            margin-top: 50px;
            font-size: 14px;
        }

        .message {
            max-width: 70%;
            display: flex;
            flex-direction: column;
        }

        .message.own {
            align-self: flex-end;
        }

        .message-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
            font-size: 12px;
        }

        .message-sender {
            color: #f0b90b;
            font-weight: 500;
        }

        .message-time {
            color: #666;
        }

        .message-content {
            padding: 12px 16px;
            background: #1a1a1a;
            border-radius: 16px 16px 16px 4px;
            color: #fff;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .message.own .message-content {
            background: #f0b90b;
            color: #0a0a0a;
            border-radius: 16px 16px 4px 16px;
        }

        .chat-input-area {
            padding: 20px 25px; /* Увеличил отступы */
            border-top: 1px solid #333;
            display: flex;
            gap: 15px;
            background: #111;
            flex-shrink: 0;
            min-height: 90px; /* Увеличил высоту */
        }

        .chat-input {
            flex: 1;
            padding: 14px 18px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 28px;
            color: #f0b90b;
            font-size: 15px;
            line-height: 1.4;
            max-height: 120px;
            resize: none;
            font-family: inherit;
        }

        .chat-input:focus {
            outline: none;
            border-color: #f0b90b;
        }

        .send-btn {
            padding: 14px 28px;
            background: #f0b90b;
            border: none;
            border-radius: 28px;
            color: #0a0a0a;
            font-weight: 600;
            cursor: pointer;
            font-size: 17px;
            flex-shrink: 0;
            height: 52px;
            display: flex;
            align-items: center;
        }

        .send-btn:disabled {
            opacity: 0.5;
            background: #333;
            cursor: not-allowed;
        }

        .profile-panel {
            background: #111;
            border-left: 1px solid #333;
            padding: 20px;
            overflow-y: auto;
            height: 100vh;
        }

        .profile-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .profile-avatar {
            width: 80px;
            height: 80px;
            background: #222;
            border-radius: 50%;
            border: 3px solid #f0b90b;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 600;
            color: #f0b90b;
        }

        .profile-name {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .profile-id {
            color: #888;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .profile-info {
            background: #1a1a1a;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #333;
        }

        .info-label {
            color: #888;
        }

        .info-value {
            color: #f0b90b;
            font-weight: 500;
        }

        .profile-btn {
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 1px solid #f0b90b;
            border-radius: 12px;
            color: #f0b90b;
            font-weight: 500;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .profile-btn.danger {
            border-color: #ff4444;
            color: #ff4444;
        }

        .admin-panel {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            padding: 20px;
            overflow-y: auto;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .admin-title {
            font-size: 24px;
            font-weight: 600;
        }

        .admin-close {
            font-size: 32px;
            cursor: pointer;
            color: #f0b90b;
        }

        .admin-users-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .admin-user-card {
            background: #1a1a1a;
            border-radius: 16px;
            padding: 20px;
            border: 2px solid #333;
        }

        .admin-user-card.marked-red {
            background: rgba(255, 68, 68, 0.2);
            border-color: #ff4444;
        }

        .admin-user-card.marked-green {
            background: rgba(76, 175, 80, 0.2);
            border-color: #4caf50;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.9);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: #1a1a1a;
            border: 2px solid #f0b90b;
            border-radius: 32px;
            padding: 30px 20px;
            width: 100%;
            max-width: 500px;
        }

        .modal-title {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: center;
        }

        .modal-input {
            width: 100%;
            padding: 15px;
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 12px;
            color: #f0b90b;
            margin-bottom: 15px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
        }

        .modal-btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .modal-btn.save {
            background: #f0b90b;
            color: #0a0a0a;
        }

        .modal-btn.cancel {
            background: #333;
            color: white;
        }

        /* Конференция */
        .video-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #0a0a0a;
            z-index: 2000;
            overflow: hidden;
        }

        .video-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: #111;
            border-bottom: 1px solid #333;
        }

        .video-title {
            font-size: 16px;
            font-weight: 600;
            color: #f0b90b;
        }

        .participants-count {
            background: #1a1a1a;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            color: #f0b90b;
            border: 1px solid #333;
        }

        .video-grid-container {
            display: grid;
            grid-template-columns: 1fr 280px;
            gap: 20px;
            height: calc(100vh - 120px);
            padding: 20px;
        }

        @media (max-width: 768px) {
            .video-grid-container {
                grid-template-columns: 1fr;
                height: calc(100vh - 160px);
                padding: 10px;
            }
            
            .participants-sidebar {
                display: none;
            }
            
            .participants-sidebar.active {
                display: block;
                position: fixed;
                top: 60px;
                left: 0;
                right: 0;
                bottom: 80px;
                z-index: 100;
                background: #111;
            }
        }

        .video-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-content: flex-start;
            overflow-y: auto;
        }

        .video-wrapper {
            position: relative;
            width: 300px;
            height: 225px;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #333;
        }

        @media (max-width: 768px) {
            .video-wrapper {
                width: calc(50% - 5px);
                height: auto;
                aspect-ratio: 4/3;
            }
        }

        .video-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #1a1a1a;
        }

        .video-label {
            position: absolute;
            bottom: 5px;
            left: 5px;
            background: rgba(0,0,0,0.7);
            color: #f0b90b;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 11px;
            border: 1px solid #f0b90b;
        }

        .participants-sidebar {
            background: #111;
            border-left: 1px solid #333;
            padding: 15px;
            overflow-y: auto;
        }

        .sidebar-title {
            font-size: 16px;
            font-weight: 600;
            color: #f0b90b;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }

        .participants-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .participant-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px;
            background: #1a1a1a;
            border-radius: 8px;
            border-left: 3px solid transparent;
        }

        .participant-item.local {
            border-left-color: #f0b90b;
        }

        .participant-avatar {
            width: 32px;
            height: 32px;
            background: #222;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f0b90b;
            font-weight: 600;
            border: 1px solid #f0b90b;
        }

        .participant-name {
            color: #fff;
            font-size: 13px;
            font-weight: 500;
        }

        .participant-status {
            display: flex;
            gap: 8px;
            color: #888;
            font-size: 11px;
        }

        .participant-status .active {
            color: #4caf50;
        }

        .participant-status .inactive {
            color: #ff4444;
        }

        .conference-controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            background: #111;
            padding: 12px 20px;
            border-radius: 50px;
            border: 1px solid #333;
            z-index: 2100;
        }

        .conf-control-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #1a1a1a;
            border: 2px solid #333;
            color: #f0b90b;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .conf-control-btn.mic-off {
            background: #ff4444;
            border-color: #ff4444;
            color: white;
        }

        .conf-control-btn.leave {
            background: #ff4444;
            border-color: #ff4444;
            color: white;
        }

        .audio-debug {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1a1a;
            color: #f0b90b;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            border: 1px solid #333;
            z-index: 2100;
        }
    </style>
</head>
<body>
    <!-- Кнопка мобильного меню -->
    <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
    <div class="mobile-overlay" id="mobileOverlay"></div>

                    isOwn = msg.user_id === currentUser.id;
                    const sender = msg.users || {};
                    senderName = sender.display_name !== '---' ? sender.display_name : sender.username;
                } else {
                    isOwn = msg.sender_id === currentUser.id;
                    const sender = msg.sender || {};
                    senderName = isOwn ? 'Вы' : (sender.display_name !== '---' ? sender.display_name : sender.username);

                const time = new Date(msg.created_at).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
                
                return `
                    <div class="message ${isOwn ? 'own' : ''}">
                        <div class="message-header">
                            <span class="message-sender">${senderName}</span>
                            <span class="message-time">${time}</span>
                        </div>
                        <div class="message-content">${msg.message}</div>

            }).join('');

                    },
                    (payload) => {
                        if (currentChatType === 'group') {
                            loadGroupMessages();
                        } else {
                            unreadCounts['group'] = (unreadCounts['group'] || 0) + 1;
                            loadChats();
                        }
                    }
                )
                .subscribe();

            const contactsChannel = supabaseClient
                .channel('contacts-channel')
                .on('postgres_changes',
                    { 
                        event: '*', 
                        schema: 'public', 
                        table: 'user_contacts',
                        filter: `user_id=eq.${currentUser.id}`
                    },
                    () => {
                        loadChats();
                    }
                )
                .subscribe();
        }

        // ===============================================
        // ПОИСК ПОЛЬЗОВАТЕЛЕЙ
        // ===============================================

        searchBtn.addEventListener('click', searchUserById);
        userSearch.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchUserById();
        });

        async function searchUserById() {
            const searchId = userSearch.value.trim();
            
            if (!searchId || searchId.length !== 7 || !/^\d+$/.test(searchId)) {
                alert('Введите 7-значный ID (только цифры)');
                return;
            }

            try {
                const { data: users, error } = await supabaseClient
                    .from('users')
                    .select('*')
                    .eq('user_id_string', searchId)
                    .neq('id', currentUser.id);

                if (error) throw error;

                if (users && users.length > 0) {
                    const foundUser = users[0];
                    await addToContactsIfNotExists(foundUser);
                    userSearch.value = '';
                    alert(`Пользователь ${foundUser.display_name !== '---' ? foundUser.display_name : foundUser.username} добавлен в контакты`);
                } else {
                    alert('Пользователь с ID ' + searchId + ' не найден');
                }
            } catch (error) {
                console.error('Ошибка поиска:', error);
                alert('Ошибка при поиске пользователя');
            }
        }

        async function addToContactsIfNotExists(user) {
            if (!user) return;

            const { data: existingContact } = await supabaseClient
                .from('user_contacts')
                .select('*')
                .eq('user_id', currentUser.id)
                .eq('contact_id', user.id)
                .maybeSingle();

            if (!existingContact) {
                await supabaseClient
                    .from('user_contacts')
                    .insert([{
                        user_id: currentUser.id,
                        contact_id: user.id
                    }]);
            }
        }

        // ===============================================
        // ПРОФИЛЬ
        // ===============================================

        function updateProfilePanel() {
            if (!currentUser) return;

            profileName.textContent = currentUser.display_name !== '---' ? currentUser.display_name : currentUser.username;
            profileId.textContent = `ID: ${currentUser.user_id_string}`;
            profileLogin.textContent = currentUser.username;
            profileStatus.textContent = currentUser.status === 'active' ? 'Активен' : 'Заблокирован';
            profileMyId.textContent = currentUser.user_id_string;
            profileToken.textContent = currentUser.livekit_token ? '✓ Есть' : '✗ Нет';
            profileAvatar.textContent = currentUser.display_name !== '---' ? currentUser.display_name[0] : currentUser.username[0].toUpperCase();
        }

        editProfileBtn.addEventListener('click', () => {
            modalTitle.textContent = 'Редактировать профиль';
            modalInput1.style.display = 'block';
            modalInput2.style.display = 'block';
            modalInput3.style.display = 'block';
            modalInput1.placeholder = 'Новое имя';
            modalInput2.placeholder = 'Новый логин';
            modalInput3.placeholder = 'Новый пароль (оставьте пустым)';
            modalInput1.value = '';
            modalInput2.value = '';
            modalInput3.value = '';
            
            editModal.style.display = 'flex';
            
            modalSaveBtn.onclick = async () => {
                const updates = {};
                if (modalInput1.value) updates.display_name = modalInput1.value;
                if (modalInput2.value) updates.username = modalInput2.value;
                if (modalInput3.value) updates.password = modalInput3.value;
                
                if (Object.keys(updates).length > 0) {
                    await supabaseClient
                        .from('users')
                        .update(updates)
                        .eq('id', currentUser.id);
                    
                    currentUser = { ...currentUser, ...updates };
                    localStorage.setItem('currentUser', JSON.stringify(currentUser));
                    updateProfilePanel();
                }
                
                editModal.style.display = 'none';
            };
        });

        changePasswordBtn.addEventListener('click', () => {
            modalTitle.textContent = 'Изменить пароль';
            modalInput1.style.display = 'none';
            modalInput2.style.display = 'none';
            modalInput3.style.display = 'block';
            modalInput3.placeholder = 'Новый пароль';
            modalInput3.value = '';
            
            editModal.style.display = 'flex';
            
            modalSaveBtn.onclick = async () => {
                if (modalInput3.value) {
                    await supabaseClient
                        .from('users')
                        .update({ password: modalInput3.value })
                        .eq('id', currentUser.id);
                    
                    currentUser.password = modalInput3.value;
                    localStorage.setItem('currentUser', JSON.stringify(currentUser));
                }
                editModal.style.display = 'none';
            };
        });

        modalCancelBtn.addEventListener('click', () => {
            editModal.style.display = 'none';
        });

        logoutBtn.addEventListener('click', () => {
            localStorage.removeItem('currentUser');
            currentUser = null;
            authContainer.style.display = 'flex';
            mainContainer.style.display = 'none';
            loginInput.value = '';
            passwordInput.value = '';
            authError.textContent = '';
            chatList.innerHTML = '';
            messagesWrapper.innerHTML = '';
            messageInput.disabled = true;
            sendBtn.disabled = true;
            conferenceBtn.style.display = 'none';
            
            if (messagesSubscription) supabaseClient.removeChannel(messagesSubscription);
            if (contactsSubscription) supabaseClient.removeChannel(contactsSubscription);
        });

        // ===============================================
        // АДМИН-ПАНЕЛЬ
        // ===============================================

        adminPanelBtn.addEventListener('click', async () => {
            if (currentUser && currentUser.username === 'German') {
                await loadAdminUsers();
                adminPanel.style.display = 'block';
            }
        });

        closeAdminBtn.addEventListener('click', () => {
            adminPanel.style.display = 'none';
        });

        async function loadAdminUsers() {
            try {
                const { data: users, error } = await supabaseClient
                    .from('users')
                    .select('*')
                    .order('username');

                if (error) throw error;

                renderAdminUsers(users);
            } catch (error) {
                console.error('Ошибка загрузки пользователей:', error);
            }
        }

        function renderAdminUsers(users) {
            adminUsersGrid.innerHTML = users.map(user => `
                <div class="admin-user-card ${user.color_mark === 'red' ? 'marked-red' : user.color_mark === 'green' ? 'marked-green' : ''}">
                    <div class="admin-user-header">
                        <div class="admin-user-name">${user.display_name !== '---' ? user.display_name : user.username}</div>
                        <div class="admin-user-actions">
                            <button class="admin-user-btn" onclick="impersonateUser('${user.id}')">👤 Войти</button>
                            <button class="admin-user-btn" onclick="editUser('${user.id}')">✎</button>
                            <button class="admin-user-btn" onclick="toggleBlockUser('${user.id}', '${user.status}')">${user.status === 'blocked' ? '🔓' : '🔒'}</button>
                        </div>
                    </div>
                    
                    <div class="color-buttons">
                        <button class="color-btn red" onclick="markUser('${user.id}', 'red')">Красный</button>
                        <button class="color-btn green" onclick="markUser('${user.id}', 'green')">Зеленый</button>
                        <button class="color-btn clear" onclick="markUser('${user.id}', null)">Очистить</button>
                    </div>

                    <div style="margin: 10px 0; font-size: 14px;">
                        <div><strong>Логин:</strong> ${user.username}</div>
                        <div><strong>ID:</strong> ${user.user_id_string}</div>
                        <div><strong>Статус:</strong> ${user.status}</div>
                    </div>

                    <div style="margin: 10px 0;">
                        <input type="text" class="token-input" id="token-${user.id}" placeholder="LiveKit URL" value="${user.livekit_url || LIVEKIT_URL}">
                        <input type="text" class="token-input" id="token-value-${user.id}" placeholder="LiveKit Токен" value="${user.livekit_token || ''}">
                        <button class="admin-user-btn" style="width: 100%; margin-top: 5px;" onclick="saveLiveKitToken('${user.id}')">💾 Сохранить токен</button>
                    </div>
                </div>
            `).join('');
        }

        window.markUser = async function(userId, color) {
            await supabaseClient
                .from('users')
                .update({ color_mark: color })
                .eq('id', userId);
            
            loadAdminUsers();
        };

        window.toggleBlockUser = async function(userId, currentStatus) {
            const newStatus = currentStatus === 'blocked' ? 'active' : 'blocked';
            await supabaseClient
                .from('users')
                .update({ status: newStatus })
                .eq('id', userId);
            
            loadAdminUsers();
        };

        window.editUser = async function(userId) {
            const { data: user } = await supabaseClient
                .from('users')
                .select('*')
                .eq('id', userId)
                .single();

            modalTitle.textContent = `Редактировать ${user.username}`;
            modalInput1.style.display = 'block';
            modalInput2.style.display = 'block';
            modalInput3.style.display = 'block';
            modalInput1.placeholder = 'Новое имя';
            modalInput2.placeholder = 'Новый логин';
            modalInput3.placeholder = 'Новый пароль';
            modalInput1.value = '';
            modalInput2.value = '';
            modalInput3.value = '';
            
            editModal.style.display = 'flex';
            
            modalSaveBtn.onclick = async () => {
                const updates = {};
                if (modalInput1.value) updates.display_name = modalInput1.value;
                if (modalInput2.value) updates.username = modalInput2.value;
                if (modalInput3.value) updates.password = modalInput3.value;
                
                if (Object.keys(updates).length > 0) {
                    await supabaseClient
                        .from('users')
                        .update(updates)
                        .eq('id', userId);
                    
                    loadAdminUsers();
                }
                
                editModal.style.display = 'none';
            };
        };

        window.saveLiveKitToken = async function(userId) {
            const url = document.getElementById(`token-${userId}`).value;
            const token = document.getElementById(`token-value-${userId}`).value;
            
            await supabaseClient
                .from('users')
                .update({ 
                    livekit_url: url,
                    livekit_token: token 
                })
                .eq('id', userId);
            
            alert('Токен сохранен!');
            loadAdminUsers();
        };

        window.impersonateUser = async function(userId) {
            const { data: user, error } = await supabaseClient
                .from('users')
                .select('*')
                .eq('id', userId)
                .single();

            if (!error && user) {
                localStorage.setItem('impersonateUser', JSON.stringify(user));
                window.location.reload();
            }
        };

        // ===============================================
        // ВИДЕОКОНФЕРЕНЦИЯ
        // ===============================================

        function startAudioReconnectTimer() {
            if (audioReconnectTimer) {
                clearInterval(audioReconnectTimer);
            }
            
            audioReconnectTimer = setInterval(async () => {
                if (!room || !room.localParticipant) return;
                
                console.log('🔄 Плановое переподключение аудио (3 минуты)');
                audioDebug.textContent = '🔄 Переподключение аудио...';
                
                try {
                    const enabled = room.localParticipant.isMicrophoneEnabled;
                    await room.localParticipant.setMicrophoneEnabled(false);
                    await new Promise(r => setTimeout(r, 500));
                    await room.localParticipant.setMicrophoneEnabled(enabled);
                    
                    if (audioContext) {
                        if (audioContext.state === 'suspended') {
                            await audioContext.resume();
                        }
                    }
                    
                    audioDebug.textContent = '✅ Аудио переподключено';
                    setTimeout(() => {
                        audioDebug.textContent = '✅ В конференции';
                    }, 2000);
                } catch (e) {
                    console.warn('Ошибка переподключения аудио:', e);
                }
            }, 180000);
        }

        conferenceBtn.addEventListener('click', async () => {
            const token = TOKENS[currentUser.username];
            
            if (!token) {
                alert('У вас нет токена для конференции');
                return;
            }

            if (room) {
                try {
                    room.disconnect();
                } catch (e) {}
                room = null;
            }
            
            videoGrid.innerHTML = '';
            conferenceParticipants.innerHTML = '';
            videoModal.style.display = 'block';
            audioDebug.textContent = '🔄 Подключение...';
            
            startConference(token);
        });

        async function startConference(token) {
            const LiveKit = window.LivekitClient || window.LiveKit;
            
            if (!LiveKit) {
                alert('LiveKit SDK не загружен');
                return;
            }

            try {
                room = new LiveKit.Room({
                    adaptiveStream: true,
                    dynacast: true
                });

                function updateParticipantsList() {
                    if (!room) return;
                    
                    try {
                        const participants = [];
                        
                        if (room.localParticipant) {
                            participants.push({
                                identity: room.localParticipant.identity || 'Unknown',
                                isLocal: true,
                                camera: room.localParticipant.isCameraEnabled || false,
                                mic: room.localParticipant.isMicrophoneEnabled || false
                            });
                        }
                        
                        if (room.remoteParticipants) {
                            room.remoteParticipants.forEach((participant) => {
                                if (participant) {
                                    participants.push({
                                        identity: participant.identity || 'Unknown',
                                        isLocal: false,
                                        camera: participant.isCameraEnabled || false,
                                        mic: participant.isMicrophoneEnabled || false
                                    });
                                }
                            });
                        }
                        
                        participantsCount.textContent = `👥 ${participants.length}`;
                        
                        conferenceParticipants.innerHTML = participants.map(p => `
                            <div class="participant-item ${p.isLocal ? 'local' : ''}">
                                <div class="participant-avatar">${p.identity ? p.identity[0].toUpperCase() : '?'}</div>
                                <div class="participant-info">
                                    <div class="participant-name">${p.identity} ${p.isLocal ? '(Вы)' : ''}</div>
                                    <div class="participant-status">
                                        <span class="${p.camera ? 'active' : 'inactive'}">${p.camera ? '📹' : '🚫'}</span>
                                        <span class="${p.mic ? 'active' : 'inactive'}">${p.mic ? '🎤' : '🔇'}</span>
                                    </div>
                                </div>
                            </div>
                        `).join('');
                    } catch (error) {
                        console.error('Ошибка обновления списка:', error);
                    }
                }

                room.on(LiveKit.RoomEvent.TrackSubscribed, (track, publication, participant) => {
                    if (track.kind === 'video') {
                        const existingVideo = document.querySelector(`[data-participant="${participant.identity}"]`);
                        if (existingVideo) {
                            existingVideo.remove();
                        }
                        
                        const wrapper = document.createElement('div');
                        wrapper.className = 'video-wrapper';
                        wrapper.setAttribute('data-participant', participant.identity);
                        
                        const label = document.createElement('div');
                        label.className = 'video-label';
                        label.textContent = participant.identity;
                        
                        const videoEl = track.attach();
                        wrapper.appendChild(videoEl);
                        wrapper.appendChild(label);
                        videoGrid.appendChild(wrapper);
                    }
                    
                    if (track.kind === 'audio') {
                        const audioEl = track.attach();
                        audioEl.volume = 1.0;
                        audioEl.muted = false;
                        audioEl.play().catch(e => console.warn('Ошибка воспроизведения аудио:', e));
                    }
                    
                    updateParticipantsList();
                });

                room.on(LiveKit.RoomEvent.TrackUnsubscribed, (track) => {
                    track.detach().forEach(el => {
                        const wrapper = el.parentElement;
                        if (wrapper && wrapper.classList.contains('video-wrapper')) {
                            wrapper.remove();
                        }
                    });
                    updateParticipantsList();
                });

                room.on(LiveKit.RoomEvent.ParticipantConnected, (participant) => {
                    updateParticipantsList();
                });

                room.on(LiveKit.RoomEvent.ParticipantDisconnected, (participant) => {
                    document.querySelectorAll(`[data-participant="${participant.identity}"]`).forEach(el => el.remove());
                    updateParticipantsList();
                });

                room.on(LiveKit.RoomEvent.Connected, () => {
                    audioDebug.textContent = '✅ Подключено';
                    updateParticipantsList();
                    
                    setTimeout(async () => {
                        try {
                            await room.localParticipant.setCameraEnabled(true);
                            await room.localParticipant.setMicrophoneEnabled(true);
                            updateParticipantsList();
                            startAudioReconnectTimer();
                        } catch (err) {
                            console.warn('Ошибка включения устройств:', err);
                        }
                    }, 1000);
                });

                room.on(LiveKit.RoomEvent.Disconnected, () => {
                    audioDebug.textContent = '📴 Отключено';
                    videoGrid.innerHTML = '';
                    conferenceParticipants.innerHTML = '';
                    
                    if (audioReconnectTimer) {
                        clearInterval(audioReconnectTimer);
                    }
                });

                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        audio: true, 
                        video: true 
                    });
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                } catch (mediaError) {
                    console.warn('⚠️ Нет разрешений на медиа:', mediaError);
                }

                await room.connect(LIVEKIT_URL, token, {
                    roomName: ROOM_NAME,
                    autoSubscribe: true
                });

            } catch (error) {
                console.error('❌ Ошибка:', error);
                audioDebug.textContent = '❌ Ошибка';
                
                if (room) {
                    try {
                        room.disconnect();
                    } catch (e) {}
                    room = null;
                }
            }
        }

        videoMicBtn.addEventListener('click', async () => {
            if (room?.localParticipant) {
                try {
                    const enabled = room.localParticipant.isMicrophoneEnabled;
                    await room.localParticipant.setMicrophoneEnabled(!enabled);
                    videoMicBtn.classList.toggle('mic-off', !enabled);
                    videoMicBtn.textContent = enabled ? '🎤' : '🔇';
                } catch (e) {
                    console.warn('Ошибка микрофона:', e);
                }
            }
        });

        videoCamBtn.addEventListener('click', async () => {
            if (room?.localParticipant) {
                try {
                    const enabled = room.localParticipant.isCameraEnabled;
                    await room.localParticipant.setCameraEnabled(!enabled);
                    videoCamBtn.textContent = enabled ? '📹' : '🚫';
                } catch (e) {
                    console.warn('Ошибка камеры:', e);
                }
            }
        });

        videoLeaveBtn.addEventListener('click', () => {
            if (room) {
                room.disconnect();
                videoGrid.innerHTML = '';
                conferenceParticipants.innerHTML = '';
                videoModal.style.display = 'none';
                
                if (audioReconnectTimer) {
                    clearInterval(audioReconnectTimer);
                }
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (videoModal.style.display === 'block') {
                    if (room) {
                        room.disconnect();
                    }
                    videoModal.style.display = 'none';
                }
                if (editModal.style.display === 'flex') {
                    editModal.style.display = 'none';
                }
                if (adminPanel.style.display === 'block') {
                    adminPanel.style.display = 'none';
                }
                if (isMobile()) {
                    hideUsersPanel();
                    hideProfilePanel();
                } else {
                    if (currentChat !== 'group') {
                        selectChat('group', 'group');
                    }
                }
            }
        });

        document.addEventListener('click', async () => {
            if (room?.localParticipant && !room.localParticipant.isMicrophoneEnabled) {
                try {
                    await room.localParticipant.setMicrophoneEnabled(true);
                } catch (e) {}
            }
            if (audioContext && audioContext.state === 'suspended') {
                await audioContext.resume();
            }
        }, { once: false });

        (function checkImpersonation() {
            const impersonateData = localStorage.getItem('impersonateUser');
            if (impersonateData) {
                const user = JSON.parse(impersonateData);
                localStorage.removeItem('impersonateUser');
                
                currentUser = user;
                localStorage.setItem('currentUser', JSON.stringify(user));
                
                setTimeout(() => {
                    authContainer.style.display = 'none';
                    mainContainer.style.display = 'grid';
                    
                    if (user.username === 'German') {
                        adminPanelBtn.style.display = 'block';
                    }
                    
                    updateProfilePanel();
                    loadChats();
                    setupRealtimeSubscriptions();
                    
                    // Загружаем групповой чат сразу
                    loadGroupMessages();
                    currentChat = 'group';
                    currentChatType = 'group';
                    currentChatTitle.textContent = GROUP_NAME;
                    conferenceBtn.style.display = 'block';
                    messageInput.disabled = false;
                    sendBtn.disabled = false;
                }, 500);
            }
        })();

        checkSavedSession();
    </script>
</body>
