<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Тест LiveKit</title>
    <style>
        body { background: #0a0a0a; color: #f0b90b; font-family: Arial; text-align: center; padding: 20px; }
        video { width: 300px; height: 200px; border: 2px solid #f0b90b; border-radius: 12px; margin: 5px; }
        button { background: #f0b90b; color: black; border: none; padding: 10px 20px; margin: 5px; border-radius: 8px; cursor: pointer; }
        #status { margin: 20px; padding: 10px; background: #1a1a1a; border-radius: 8px; }
    </style>
</head>
<body>
    <h1>🔧 Тест подключения</h1>
    <div id="status">⏳ Загрузка...</div>
    <div id="videos"></div>
    <div>
        <button id="micBtn">🎤 Вкл/Выкл микрофон</button>
        <button id="leaveBtn">🚪 Выйти</button>
    </div>

    <!-- Подключаем LiveKit через CDN -->
    <script src="https://cdn.jsdelivr.net/npm/livekit-client@1.15.4/dist/livekit-client.umd.min.js"></script>

    <script>
        const LIVEKIT_URL = 'wss://testzvonok-3q10z44j.livekit.cloud';
        const TOKEN = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJleHAiOjE3ODE3OTA2NTIsImlkZW50aXR5IjoiYWRtaW4iLCJpc3MiOiJBUEk4aGZuaHc3WXlueE4iLCJuYmYiOjE3NzE3OTA2NTIsInN1YiI6ImFkbWluIiwidmlkZW8iOnsiY2FuUHVibGlzaCI6dHJ1ZSwiY2FuUHVibGlzaERhdGEiOnRydWUsImNhblN1YnNjcmliZSI6dHJ1ZSwicm9vbSI6InNlY3VyZS1zdGFjay0xazViOTUiLCJyb29tSm9pbiI6dHJ1ZX19.ZZJvSlcJ6euQOa9tiLvFOboyp2F0oMQkXUbCEKvB4R4';
        const ROOM_NAME = 'secure-stack-1k5b95';

        let room;
        const statusEl = document.getElementById('status');
        const videosEl = document.getElementById('videos');

        async function connect() {
            if (!window.LiveKit) {
                statusEl.innerHTML = '❌ LiveKit не загрузился';
                return;
            }

            try {
                statusEl.innerHTML = '🔄 Подключаемся...';
                
                room = new LiveKit.Room();
                
                room.on(LiveKit.RoomEvent.TrackSubscribed, (track) => {
                    if (track.kind === 'video') {
                        const el = track.attach();
                        videosEl.appendChild(el);
                        statusEl.innerHTML = '✅ Видео получено';
                    }
                });

                room.on(LiveKit.RoomEvent.Disconnected, () => {
                    statusEl.innerHTML = '📴 Отключено';
                    videosEl.innerHTML = '';
                });

                room.on(LiveKit.RoomEvent.Connected, () => {
                    statusEl.innerHTML = '✅ Подключено!';
                });

                await room.connect(LIVEKIT_URL, TOKEN, { roomName: ROOM_NAME });
                
                // Включаем камеру и микрофон
                await room.localParticipant.setCameraEnabled(true);
                await room.localParticipant.setMicrophoneEnabled(true);

            } catch (err) {
                statusEl.innerHTML = '❌ Ошибка: ' + err.message;
                console.error(err);
            }
        }

        // Ждем загрузки скрипта
        setTimeout(() => {
            if (window.LiveKit) {
                connect();
            } else {
                statusEl.innerHTML = '❌ LiveKit не загрузился';
            }
        }, 1000);

        // Кнопки
        document.getElementById('micBtn').onclick = () => {
            if (room?.localParticipant) {
                const enabled = room.localParticipant.isMicrophoneEnabled;
                room.localParticipant.setMicrophoneEnabled(!enabled);
            }
        };

        document.getElementById('leaveBtn').onclick = () => {
            if (room) room.disconnect();
        };
    </script>
</body>
</html>
