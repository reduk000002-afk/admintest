<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Binance Brief · Брифінг</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', sans-serif; }
  body { background:#0a0a0a; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; min-height:100vh; }
  header { background:#1e1f25; width:100%; padding:20px; text-align:center; color:#f0b90b; font-size:1.5rem; font-weight:bold; display:flex; justify-content:center; align-items:center; gap:10px; }
  iframe { width:100%; flex:1; border:none; min-height:80vh; }
  .btn-container { margin:20px; }
  .btn { padding:12px 30px; border:none; border-radius:12px; background:#f0b90b; color:#0a0a0a; font-weight:bold; cursor:pointer; display:flex; align-items:center; gap:10px; font-size:1rem; }
  .btn:hover { background:#ffd53d; }
</style>
</head>
<body>

<header>
  <i class="fas fa-microphone-alt"></i> Binance Brief
</header>

<div class="btn-container">
  <button class="btn" onclick="joinConference()"><i class="fas fa-headphones"></i> Приєднатися до брифінгу</button>
</div>

<iframe id="conferenceFrame" src="" allow="camera; microphone"></iframe>

<script>
  // Ссылка на комнату Whereby для участников
  const roomUrl = "https://spam.whereby.com/spam-%D0%B5%D1%83%D1%84%D1%8C30421668-7aae-4d75-a986-16f5af820fbe";

  function joinConference() {
    const frame = document.getElementById('conferenceFrame');
    frame.src = roomUrl;
  }
</script>

</body>
</html>
