<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Secure Briefing</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background: #0a0a0a;
      color: #f0b90b;
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      margin: 0;
    }
    h1 { margin-bottom: 20px; }
    #videoContainer {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      width: 100%;
      max-width: 900px;
      margin-bottom: 20px;
    }
    video {
      border-radius: 12px;
      border: 2px solid #f0b90b;
      width: 300px;
      height: 200px;
      background: #1a1a1a;
      object-fit: cover;
    }
    .btn {
      background: #f0b90b;
      color: #0a0a0a;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: bold;
      margin: 5px;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.3s;
    }
    .btn:hover { background: #ffd53d; transform: scale(1.05); }
    .btn-secondary {
      background: #0c0f15;
      color: #f0b90b;
      border: 1px solid #2c2f36;
    }
    .btn-secondary:hover { background: #1e1f25; }
    #status {
      margin: 10px 0;
      color: #888;
      font-size: 14px;
      padding: 8px 16px;
      border-radius: 20px;
      background: #1a1a1a;
    }
    .error {
      color: #ff6b6b;
    }
  </style>
</head>
<body>

<h1>Secure Briefing</h1>
<div id="status">⏳ Загрузка...</div>
<div id="videoContainer"></div>

<div>
  <button class="btn" id="micBtn" disabled>🎤 Включить микрофон</button>
  <button class="btn btn-secondary" id="leaveBtn" disabled>🚪 Выйти</button>
</div>

<!-- Пробуем разные CDN для загрузки LiveKit -->
<script>
  // Функция для загрузки скрипта с проверкой
  function loadScript(url, callback) {
    const script = document.createElement('script');
    script.src = url;
    script.onload = callback;
    script.onerror = function() {
      console.error('Не удалось загрузить:', url);
      // Пробуем следующий CDN
      loadNextCDN();
    };
    document.head.appendChild(script);
  }

  // Список CDN для проброса
  const cdnList = [
    'https://cdn.jsdelivr.net/npm/livekit-client@1.15.4/dist/livekit-client.umd.min.js',
    'https://unpkg.com/livekit-client@1.15.4/dist/livekit-client.umd.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/livekit-client/1.15.4/livekit-client.umd.min.js'
  ];

  let currentCdnIndex = 0;

  function loadNextCDN() {
    if (currentCdnIndex < cdnList.length) {
      console.log('Пробуем CDN:', cdnList[currentCdnIndex]);
      loadScript(cdnList[currentCdnIndex], function() {
        console.log('Скрипт загружен, проверяем LiveKit...');
        setTimeout(checkLiveKit, 500);
      });
      currentCdnIndex++;
    } else {
      document.getElementById('status').innerHTML = '❌ Не удалось загрузить LiveKit SDK. Проверьте интернет-соединение.';
      document.getElementById('status').classList.add('error');
    }
  }

  function checkLiveKit() {
    if (typeof LiveKit !== 'undefined') {
      console.log('✅ LiveKit успешно загружен!');
      document.getElementById('status').innerHTML = '✅ SDK загружен, подключаемся...';
      document.getElementById('micBtn').disabled = false;
      document.getElementById('leaveBtn').disabled = false;
      initRoom();
    } else {
      console.log('LiveKit всё ещё не загружен');
      loadNextCDN();
    }
  }

  // Начинаем загрузку
  document.addEventListener('DOMContentLoaded', function() {
    console.log('DOM загружен, начинаем загрузку LiveKit...');
    loadNextCDN();
  });

  // Конфигурация LiveKit
  const LIVEKIT_URL = 'wss://testzvonok-3q10z44j.livekit.cloud';
  const TOKEN = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJleHAiOjE3ODE3ODgxMDMsImlkZW50aXR5IjoiYWRtaW4iLCJpc3MiOiJBUEk4aGZuaHc3WXlueE4iLCJuYmYiOjE3NzE3ODgxMDMsInN1YiI6ImFkbWluIiwidmlkZW8iOnsiY2FuUHVibGlzaCI6dHJ1ZSwiY2FuUHVibGlzaERhdGEiOnRydWUsImNhblN1YnNjcmliZSI6dHJ1ZSwicm9vbSI6IldlYnNvY2tldCBVUkwgd3NzOi8vdGVzdHp2b25vay0zcTEwejQ0ai5saXZla2l0LmNsb3VkICBBUEkga2V5IEFQSThoZm5odzdZeW54TiAgQVBJIHNlY3JldCB1SGdlVFo1cW9PZTh0SU81YWJib3V6dnY5RXpqWld4UEN2MWkwQTMwb3oiLCJyb29tSm9pbiI6dHJ1ZX19.rsT7SKsOQKBv9NItq3WnQ-jVBcoGQFjTOKkpjzYgKNA';
  const ROOM_NAME = 'secure-stack-1k5b95';

  const videoContainer = document.getElementById('videoContainer');
  const statusEl = document.getElementById('status');
  let room;

  async function initRoom() {
    try {
      statusEl.innerHTML = '🔄 Подключаемся к комнате...';
      
      // Создаем комнату
      room = new LiveKit.Room();

      // Обработчик новых видео-треков
      room.on(LiveKit.RoomEvent.TrackSubscribed, (track, publication, participant) => {
        console.log('Получен трек:', track.kind, 'от', participant.identity);
        if (track.kind === 'video') {
          const videoEl = track.attach();
          videoEl.style.width = '300px';
          videoEl.style.height = '200px';
          videoContainer.appendChild(videoEl);
        }
      });

      // Обработчик удаления треков
      room.on(LiveKit.RoomEvent.TrackUnsubscribed, (track, publication, participant) => {
        console.log('Трек отписан:', track.kind);
        if (track.kind === 'video') {
          track.detach().forEach(el => el.remove());
        }
      });

      // Обработчик новых участников
      room.on(LiveKit.RoomEvent.ParticipantConnected, (participant) => {
        console.log('Участник подключился:', participant.identity);
      });

      // Обработчик отключения
      room.on(LiveKit.RoomEvent.Disconnected, () => {
        console.log('Отключено от комнаты');
        statusEl.innerHTML = '📴 Отключено';
        videoContainer.innerHTML = '';
      });

      // Подключаемся
      await room.connect(LIVEKIT_URL, TOKEN, { 
        autoSubscribe: true,
        roomName: ROOM_NAME 
      });
      
      console.log('✅ Успешно подключено к комнате');
      statusEl.innerHTML = '✅ Подключено к комнате';

      // Включаем микрофон
      await room.localParticipant.setMicrophoneEnabled(true);
      
      // Включаем камеру
      await room.localParticipant.setCameraEnabled(true);

    } catch (error) {
      console.error('Ошибка подключения:', error);
      statusEl.innerHTML = '❌ Ошибка: ' + error.message;
      statusEl.classList.add('error');
    }
  }

  // Кнопка микрофона
  document.getElementById('micBtn').addEventListener('click', async () => {
    if (!room || !room.localParticipant) {
      alert('Сначала подключитесь к комнате');
      return;
    }
    
    try {
      const isEnabled = room.localParticipant.isMicrophoneEnabled;
      await room.localParticipant.setMicrophoneEnabled(!isEnabled);
      document.getElementById('micBtn').textContent = 
        !isEnabled ? '🎤 Выключить микрофон' : '🎤 Включить микрофон';
    } catch (error) {
      console.error('Ошибка при переключении микрофона:', error);
    }
  });

  // Кнопка выхода
  document.getElementById('leaveBtn').addEventListener('click', () => {
    if (room) {
      room.disconnect();
      document.getElementById('micBtn').textContent = '🎤 Включить микрофон';
      statusEl.innerHTML = '📴 Отключено';
    }
  });
</script>

</body>
</html>
